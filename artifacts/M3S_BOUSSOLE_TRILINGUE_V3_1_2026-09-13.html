$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob(["# 2SG / M3S — Boussole globale / Gesamtkompass / Global compass\n\nVersion 3.1 · 2026-09-13 · FR / DE / EN\n\n[Français](#fr) · [Deutsch](#de) · [English](#en)\n\n<a id=\"fr\"><\/a>\n\n# Français — version source\n\n13 septembre 2026 · Lecture documentaire · V3.1\n\n[Vue d’ensemble](#fr-overview) · [Stratégie & cadre](#fr-strategy) · [Fonctions & menus](#fr-functions) · [Système technique](#fr-system) · [État des chantiers](#fr-status) · [Évolution](#fr-evolution) · [Glossaire](#fr-glossary) · [Sources](#fr-sources)\n\n<a id=\"fr-overview\"><\/a>\n\n## Vue d’ensemble\n\n**Comprendre le projet**\n\n```mermaid\nflowchart TD\nA[\"2SG\"] --> B[\"Finalité & gouvernance\"]\nA --> C[\"Fonctions & processus\"]\nB --> C\nC --> D[\"M3S · ERP, données & intelligence\"]\nD --> E[\"Vue d’ensemble / Évolution\"]\nE -.-> B\n```\n\n### Une boussole commune\n\n2SG — SeneSwiss Group porte un projet hybride Suisse–Sénégal : impact social, activités économiques, coopération et innovation numérique. M3S est son système de management et d’intelligence organisationnelle. L’ERP web en est une composante, aux côtés des personnes, règles, processus, données, documents et outils d’aide à la décision. [S1, S2]\n\n### Les sept niveaux de lecture\n\n| Niveau | Rôle |\n|---|---|\n| Identité & finalité | Mission, valeurs, inclusion, impact. |\n| Stratégie | Positionnement, DAS, offre, modèle économique. |\n| Gouvernance | AG, Bureau, décisions et responsabilités institutionnelles. |\n| Organisation | Fonctions, processus, activités, équipes, procédures et KPI. |\n| Système M3S | ERP, GED, veille, pilotage, sécurité et IA. |\n| Réalisation technique | Interface, API, données, hébergement et déploiement. |\n| Évolution | Preuves, usage, journaux et retour vers les priorités. |\n\n### Résumé exécutif au 13 septembre 2026\n\nUn socle web existe et plusieurs usages sont acquis selon l’inventaire précédent. La profondeur fonctionnelle varie : Finance/FX, Administration et un premier annuaire RH ont progressé ; CRM, Production, Stock & Actifs et certains usages GED restent à consolider. Budget réel, comptes bancaires réels et choix PostgreSQL restent encadrés et non activés selon S1. Les agents spécialisés sont une architecture cible. Priorité proposée : consolider la vision globale, qualifier les usages et leurs responsables, puis décider des prochaines activations. Aucun pourcentage global d’achèvement n’est attribué.\n\n### Repère de pilotage actuel\n\nLe cockpit M3S-GLOBAL-VUE-001 V0.2 recense 20 chantiers : 2 ACTIF, 9 ATTENTE, 2 DIFFÉRÉ, 7 FERMÉ et 0 BLOQUÉ [S10]. Les 22 actions Villa LR1, LEGAL, Finances et RH restent ouvertes en attente probatoire gouvernée, sans reprise automatique. La reprise P2-GOUV est organisée par exceptions ; son ordre confirmé est Activité + Reporting, Programme + Responsabilités, puis Administration + KPI [S11]. Le contrat manuel du premier bloc est préparé mais attend encore sa confirmation [S12].\n\n<a id=\"fr-strategy\"><\/a>\n\n## Stratégie & cadre\n\n**Du pourquoi aux responsabilités**\n\n### Quatre DAS : où agir\n\n| DAS | Finalité |\n|---|---|\n| Social | Solidarité, inclusion, formation et accompagnement. |\n| Business | Revenus, commerce, services et actifs économiques. |\n| Digital | M3S, applications, automatisation, IA et offres numériques. |\n| Gouvernance & Organisation | Cadre, coordination, conformité et maîtrise. |\n\n### DAS, offres et fonctions\n\nLes DAS constituent des axes stratégiques transversaux dans S1. Ils ne remplacent ni les fonctions ni les menus. L’offre S2 décrit notamment organisation intelligente, automatisation métier, IA souveraine, formation IA, social business et e-commerce. Ce sont des axes et packs décrits, sans preuve ici que chaque offre soit commercialisée. FluxConvert, Courrier et GED peuvent alimenter de futures offres ; LocalPilotSummary est indiqué non branché. Les anciennes BU restent des références historiques.\n\n### Qui décide ?\n\nLecture institutionnelle de S1 : l’Assemblée Générale et le Bureau portent la gouvernance. Les mandats et pouvoirs exacts se vérifient dans les statuts, PV et décisions applicables. Un rôle logiciel ou un assistant IA ne constitue pas un mandat juridique. 2SG définit les priorités et valide les décisions ; Codex intervient comme opérateur technique dans le périmètre confié. Les responsables nominatifs des abonnements, sauvegardes, données et recettes restent à renseigner.\n\n### La chaîne documentaire\n\nDocuments directeurs → audit et synthèse → référentiel fonctionnel et opérationnel → exigences ERP → code et tests → usage et preuves. S3 prévoit dix ensembles : ouvrir en premier ; fondamentaux ; document directeur ; business model/plans ; LEGAL ; technique/IA ; audit/refondation ; offre/branding ; traductions ; archives. Il s’agit d’une arborescence cible, pas d’un inventaire de dossiers tous existants. Une boussole unique relie ces sources sans remplacer leur autorité.\n\n<a id=\"fr-functions\"><\/a>\n\n## Fonctions & menus\n\n**L’organisation et son accès dans M3S**\n\n### Convention de lecture\n\nFamille de fonctions = regroupement ; fonction = responsabilité métier durable ; processus = enchaînement d’activités ; module = composante logicielle ; menu = accès à des écrans. La famille « Management & Gouvernance » peut être retenue comme lecture pédagogique ; dans le code, ce nom désigne actuellement un groupe de navigation contenant le Tableau de Bord. Le Tableau de Bord est un outil de pilotage. La correspondance organisationnelle doit être validée dans le référentiel.\n\n### Menu exact du code consulté\n\nLa carte ci-dessous reprend les groupes, libellés, sous-menus et chemins de menuStructure.json au commit e2141df74a38 (S6). Elle corrige le schéma simplifié précédent. Présence dans le code ≠ fonction disponible pour tous : permissions, déploiement et activation peuvent limiter l’accès. Le Journal d’audit requiert explicitement administration:audit:read. Les chemins sont des repères ; cette boussole n’exécute pas les fonctions de l’ERP.\n\n### Management & Gouvernance\n\n#### Tableau de Bord\n\n`/`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Vue d'ensemble | `/?view=overview` |\n| Programme institutionnel 2SG | `/?view=program` |\n| Daily Intelligence | `/?view=intelligence` |\n| Carte des fonctions | `/?view=map` |\n| Architecture & Relations | `/?view=architecture` |\n| Processus & Contrôles | `/?view=processes` |\n| Incidents & Risques | `/?view=incidents` |\n| Ressources | `/?view=resources` |\n| Glossaire | `/?view=glossary` |\n\n### Fonctions support\n\n#### Administration\n\n`/administration`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Institution | `/administration?tab=institution` |\n| Architecture & Relations | `/administration?tab=architecture` |\n| Processus & Procédures | `/administration?tab=processes` |\n| Conformité | `/administration?tab=compliance` |\n| Planification & Projets | `/administration?tab=planning` |\n| Communication & Courrier | `/administration?tab=communication` |\n| Ressources | `/administration?tab=resources` |\n| Assistant administratif | `/administration?tab=assistant` |\n| Journal d’audit · Permission requise | `/administration?tab=audit` |\n| Glossaire | `/administration?tab=glossary` |\n\n#### Finances\n\n`/finance`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Architecture & Relations | `/finance?tab=architecture` |\n| Processus & Procédures | `/finance?tab=processes` |\n| Recettes | `/finance?tab=recettes` |\n| Dépenses | `/finance?tab=depenses` |\n| Budget | `/finance?tab=budget` |\n| Social | `/finance?tab=social` |\n| Fin Immo | `/finance?tab=immobilier` |\n| Convertisseur FX | `/finance?tab=fx` |\n| Assistant Finances | `/finance?tab=assistant` |\n| Ressources | `/finance?tab=resources` |\n| Glossaire | `/finance?tab=glossary` |\n\n#### Ressources Humaines\n\n`/rh`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Architecture & Relations | `/rh?tab=architecture` |\n| Processus & Procédures | `/rh?tab=processes` |\n| Annuaire interne | `/rh?tab=directory` |\n| Teams & Profils | `/rh?tab=teams` |\n| Heures & Activités | `/rh?tab=hours` |\n| Compétences | `/rh?tab=competences` |\n| Mon Compte | `/rh?tab=myaccount` |\n| Assistant RH | `/rh?tab=assistant` |\n| Ressources | `/rh?tab=resources` |\n| Glossaire | `/rh?tab=glossary` |\n\n#### IT & Support\n\n`/ged`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Architecture & Relations | `/ged?tab=architecture` |\n| Processus & Procédures | `/ged?tab=processes` |\n| GED | `/ged?tab=documents` |\n| Dossiers | `/ged?tab=dossiers` |\n| Archives | `/ged?tab=archives` |\n| Outils documentaires | `/ged?tab=outils-documents` |\n| Veille & Knowledge Management | `/ged?tab=knowledge` |\n| IA & Digital | `/ged?tab=ai-digital` |\n| Gestion BDD | `/ged?tab=database` |\n| Guide Utilisateur | `/ged?tab=user-guide` |\n| Doc Technique | `/ged?tab=tech-docs` |\n| Aide & Support | `/ged?tab=help-support` |\n| Manuel d'Utilisation | `/ged?tab=manual` |\n| Assistant IT & Support | `/ged?tab=assistant` |\n| Ressources | `/ged?tab=resources` |\n| Glossaire | `/ged?tab=glossary` |\n\n### Opérations & Développement\n\n#### Commercial & CRM\n\n`/crm`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Architecture & Relations | `/crm?tab=architecture` |\n| Processus & Procédures | `/crm?tab=processes` |\n| Prospects & Leads | `/crm?tab=prospects` |\n| Clients | `/crm?tab=clients` |\n| Ventes | `/crm?tab=ventes` |\n| Dons | `/crm?tab=dons` |\n| Bénéficiaires | `/crm?tab=beneficiaires` |\n| Assistant Commercial | `/crm?tab=assistant` |\n| Ressources | `/crm?tab=resources` |\n| Glossaire | `/crm?tab=glossary` |\n\n#### Production\n\n`/production`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Architecture & Relations | `/production?tab=architecture` |\n| Processus & Procédures | `/production?tab=processes` |\n| Commandes | `/production?tab=commandes` |\n| Fabrication | `/production?tab=manufacturing` |\n| Fournisseurs | `/production?tab=fournisseurs` |\n| Stocks | `/production?tab=stocks` |\n| Assistant Production | `/production?tab=assistant` |\n| Ressources | `/production?tab=resources` |\n| Glossaire | `/production?tab=glossary` |\n\n#### Stock & Actifs\n\n`/actifs`\n\n| Tous les sous-menus | Chemin M3S |\n|---|---|\n| Architecture & Relations | `/actifs?tab=architecture` |\n| Processus & Procédures | `/actifs?tab=processes` |\n| Inventaire | `/actifs?tab=inventory` |\n| Immobilisations | `/actifs?tab=immobilisations` |\n| Risques | `/actifs?tab=risques` |\n| Assistant Stock & Actifs | `/actifs?tab=assistant` |\n| Ressources | `/actifs?tab=resources` |\n| Glossaire | `/actifs?tab=glossary` |\n\n<a id=\"fr-system\"><\/a>\n\n## Système technique\n\n**Qui fait quoi dans la chaîne ?**\n\n### Deux circuits complémentaires\n\nLe circuit d’utilisation relie le navigateur à l’interface, puis à l’API et aux données. Le circuit de fabrication relie le travail de développement à GitHub, aux tests et aux hébergeurs. Les e-mails ont leur propre circuit chez Hostpoint : ils ne passent pas nécessairement par l’interface Netlify. La carte décrit les relations ; elle ne surveille pas les services en temps réel.\n\n```mermaid\nflowchart TD\nU[\"Navigateur\"] --> N[\"React / Netlify\"]\nN --> R[\"API / Railway · S1\"]\nR --> B[\"BigQuery · S1\"]\nG[\"GitHub\"] --> T[\"Tests & preview\"]\nT --> N\nT --> R\nH[\"Hostpoint\"] --> M[\"Mail\"]\nH --> W[\"Smart Webhosting\"]\nH --> DB[\"MariaDB · ? M3S\"]\n```\n\nLa messagerie suit son propre circuit. Aucune liaison entre la base Hostpoint et M3S n’est établie.\n\n### Inventaire des composants et fournisseurs\n\n| Composant / fournisseur | Rôle simple | État et preuve |\n|---|---|---|\n| Domaine · Hostpoint | seneswiss-group.com : adresse Internet, présente dans le compte. | Compte consulté [S7]. Contrat et renouvellement à documenter. |\n| DNS · NS1 / référence Netlify | Annuaire qui oriente le trafic du domaine vers les services. | NS publics nsone.net ; SOA mentionnant Netlify [S8]. Gestion effective à confirmer. |\n| Mail · Hostpoint Cloud Office | Héberge les boîtes professionnelles ; distinct de la connexion M3S. | 4 comptes vus ; fonctionnement de la boîte de Cheikh confirmé par lui [S7,S9]. |\n| Web · Hostpoint Smart Webhosting | Espace web sur sl1797.web.hostpoint.ch ; site edegupaw.myhostpoint.ch avec Apache/PHP. | Hébergement et site configurés, vérifiés [S7]. Contenu et usage actuel du site non audités. |\n| Interface · React / Netlify | React construit les écrans ; Netlify publie et sert leur version web. | Réponse HTTP 200 avec server: Netlify pour le domaine [S8]. Recette complète non effectuée. |\n| Serveur · Node.js / Express / Railway | Reçoit les demandes, applique les règles et dialogue avec les données. | Architecture active documentée dans S1 ; état live non recontrôlé ici. |\n| Données · BigQuery / Google Cloud | Entrepôt de données historique et analytique. | Socle actif documenté [S1] ; aucune migration générale démontrée. |\n| Base · Hostpoint MariaDB | Le panneau indique une base et un serveur MariaDB 10.11. | Existence vérifiée [S7] ; contenu et liaison M3S non établis. |\n| Code · GitHub | Mémoire du code : versions, branches, revues et historique. | Frontend inspecté [S6]. Dépôts backend et cockpit identifiés [S1]. |\n| PostgreSQL / PGlite / Supabase | PostgreSQL est la technologie relationnelle candidate ; PGlite a servi aux preuves synthétiques en mémoire ; Supabase a servi uniquement à des essais éphémères bornés. | Deux essais E4 Supabase ont abouti à NO-GO puis nettoyage complet. Paiement de 27,03 USD déclaré ; aucun remboursement ou crédit confirmé. Aucun fournisseur PostgreSQL de production, stockage réel ou activation n’est retenu. |\n| Opérateurs · 2SG, Codex, assistants | 2SG décide ; Codex aide à réaliser et vérifier ; les assistants soutiennent les tâches. | Rôles décrits [S1,S4]. Aucun opérateur ne remplace la responsabilité humaine. |\n\n### L’écart DNS / mail\n\nUne requête publique MX n’a retourné aucune destination, alors que les boîtes sont présentes et que Cheikh confirme un usage fonctionnel de longue date. Ce résultat isolé reste inexpliqué : aucune panne n’est établie et aucun réglage n’a été changé. Le fonctionnement déclaré concerne sa boîte ; il ne constitue pas un test des quatre comptes.\n\n### Sécurité : trois questions distinctes\n\n| Question | Mécanisme | Limite |\n|---|---|---|\n| Qui êtes-vous ? | Authentification : identité et jeton de session / API. | S1 décrit des jetons Bearer ; ce n’est pas une preuve d’authentification Supabase. |\n| Que pouvez-vous faire ? | Autorisations : permissions selon rôles et opérations. | Un accès logiciel ne confère pas un mandat institutionnel. |\n| Que faut-il protéger ? | Secrets hors code ; données sensibles à accès limité ; sauvegarde et restauration. | Politique documentée ≠ restauration testée. Responsables et preuves à compléter. |\n\n### Les outils de fabrication\n\nS1 décrit React 19, React Router 7, Axios, Recharts, Tailwind CSS 4, Express 4, le client BigQuery et des scripts Node/Python. Ces versions sont des références documentaires, pas une mesure des versions exécutées aujourd’hui. SQL sert à interroger les données ; JSON sert à échanger des informations ; Markdown porte la documentation. Git versionne les changements et GitHub héberge les dépôts.\n\n<a id=\"fr-status\"><\/a>\n\n## État des chantiers\n\n**Les acquis, les limites et la suite**\n\n### Comment lire les statuts\n\nVérifié : observation directe identifiée. Confirmé par l’utilisateur : usage déclaré. Documenté : état rapporté dans une source, sans nouveau test ici. À consolider : réalisation partielle. Cible : orientation ou expérimentation. Non activé : frontière explicitement maintenue. La matrice suivante reprend S1 ; elle ne remplace pas une recette actuelle des modules.\n\n### Photographie documentaire [S1]\n\n| Chantier | Acquis rapporté | Suite / limite |\n|---|---|---|\n| Stratégie / LEGAL | Audit, synthèse et référentiels avancés. | Consolider Document Directeur, offre, branding et preuves institutionnelles. |\n| Interface / Administration | FR/DE/EN, thèmes, responsive ; registres et pilote institutionnel. | Distinguer disponibilité UX, données et pouvoirs réels. |\n| Finance / FX | Historique, KPI sourcés et CHF/CFA améliorés. | Rapprochements et sources historiques à compléter ; pas de « 100 % ». |\n| RH | Premier annuaire RH-001 rapporté déployé. | Le domaine RH complet n’est pas terminé. |\n| CRM / Production / Actifs | Surfaces de navigation et premiers usages. | Qualifier données réelles et workflows ; patrimoine / Villa LR1 ouverts. |\n| GED / Knowledge | Premier lot et gouvernance documentaire rapportés. | Consolider pièces sensibles, provenance et conservation. |\n| Budget / comptes bancaires | Contrats, validations et tests fictifs/masqués. | Production Budget et données bancaires réelles non ouvertes selon S1. |\n| Daily Intelligence / Inbox | V4 trilingue et pilote Inbox fictif rapportés. | Séparer génération, publication, diffusion et programme institutionnel. |\n| Agents IA / offres externes | Architecture et micro-tests décrits. | Aucune autonomie ou commercialisation générale prouvée. |\n\n### Cockpit global V0.2 [S10-S12]\n\n| File | État actuel | Règle de reprise |\n|---|---|---|\n| Vue globale | 20 chantiers : 2 ACTIF, 9 ATTENTE, 2 DIFFÉRÉ, 7 FERMÉ, 0 BLOQUÉ. | Réviser lors d’une décision, preuve ou évolution majeure. |\n| P1-REEL | Villa LR1, LEGAL, Finances et RH : 22 actions ouvertes en attente probatoire gouvernée. | Uniquement sur information humaine nouvelle ou preuve précisément autorisée. |\n| P2-GOUV | Arbitrage confirmé ; Bloc A Activité + Reporting préparé, non encore confirmé. | Confirmation groupée des huit arbitrages du Bloc A. |\n| P3-TECH / P4-RESERVE | Maintien silencieux pendant la reprise P2-GOUV. | Ne pas ouvrir sans décision distincte. |\n\n### Architecture IA cible [S4]\n\nStrategic Brain coordonne les agents spécialisés : Veille/Knowledge, Finance/FX, Data/Reporting, CRM/Relations, PMO/Projets, Développement/Automatisation ; Commerce et Offre digitale sont des extensions futures. Le flux décrit est Scout → Analyst → Creator → Editor → Publisher. « Publisher » prépare la diffusion ; une validation humaine précède la publication. Le document décrit une phase d’implémentation envisagée, sans prouver que tous les agents tournent.\n\n<a id=\"fr-evolution\"><\/a>\n\n## Évolution\n\n**Comprendre le chemin parcouru**\n\n### Repères datés\n\n| Date | Évolution | Qualification |\n|---|---|---|\n| 17.05.2026 | Architecture des agents fusionnée. | Cible de phase 2 [S4]. |\n| 04.06.2026 | Inventaire et architecture visuelle initiaux. | Historique : volumes et « complet » non repris comme faits actuels [S5]. |\n| 22.06.2026 | Architecture des documents directeurs transmise. | Arborescence cible [S3]. |\n| 13.09.2026 · V2.2 | Boussole globale : stratégie, opérations, technique et maturité. | Synthèse documentaire précédente [S1]. |\n| 13.09.2026 · V3.0 | Hostpoint réintégré ; menu exact ; termes clarifiés ; support autonome trilingue. | Nouvelle édition de la même boussole. |\n| 13.09.2026 · V3.1 | Cockpit V0.2, files de reprise, parcours technique et état Supabase intégrés. | Révision contrôlée de la source V3.0, sans modification de M3S. |\n\n### Du développement au service en ligne\n\nDéveloppement : construire ou corriger. Test : contrôler un comportement. Preview/préproduction : examiner une version avant diffusion. Production informatique : version utilisée en situation réelle. Production métier : fabriquer un produit ou réaliser une prestation — autre sens du mot. Le parcours documenté est besoin → branche → code → tests → revue/PR → preview → décision humaine → fusion/déploiement → vérification d’usage → journal. Une fusion ne prouve pas une activation.\n\n### Du besoin à l’usage réel\n\n| Étape | Question simple | Résultat attendu |\n|---|---|---|\n| 1. Besoin | Quel problème faut-il résoudre ? | Besoin et résultat attendu clairement formulés. |\n| 2. Cadrage | Que fait-on, que ne fait-on pas et qui décide ? | Périmètre, risques, responsable et critères de réussite. |\n| 3. Branche et code | Comment construire sans déranger la version stable ? | Changements isolés et traçables. |\n| 4. Tests | Le comportement attendu est-il vérifié ? | Résultats reproductibles et écarts connus. |\n| 5. PR et revue | Le changement est-il relu avant fusion ? | Verdict, corrections et décision humaine. |\n| 6. Preview | Peut-on l’essayer sans toucher à la production ? | Recette visuelle et fonctionnelle isolée. |\n| 7. Fusion et déploiement | Le code retenu est-il publié sur le bon environnement ? | Version technique disponible ; pas encore forcément activée. |\n| 8. Activation et preuve | L’usage réel est-il autorisé, accessible et contrôlé ? | Recette, décision d’activation, preuves datées et journal. |\n\n### Prochaines étapes proposées\n\n1. Relire cette boussole et valider les correspondances métier. 2. Compléter les responsables, contrats, renouvellements, sauvegardes et l’usage de la base Hostpoint. 3. Réaliser une recette authentifiée par fonction avant de déclarer un domaine complet. 4. Consolider Document Directeur, offre et portefeuille global. 5. Décider séparément du fournisseur PostgreSQL et des activations Budget/banque. 6. Préparer l’intégration de la boussole dans M3S. Une révision après changement majeur est utile ; la cadence trimestrielle reste à convenir, sans automatisation créée.\n\n<a id=\"fr-glossary\"><\/a>\n\n## Glossaire\n\n**Les mots pour s’orienter**\n\n### Rôle de ces définitions\n\nCes formulations courtes servent à l’orientation d’un profil non technique. Elles ne remplacent pas le Glossaire central 2SG, qui reste la source maître. Toute nouvelle entrée ou modification durable doit passer par la file de validation terminologique GLO-TECH-01 avant publication.\n\n### Repères sans jargon\n\n| Terme | Explication |\n|---|---|\n| ERP | Logiciel qui relie plusieurs activités de gestion de l’organisation. |\n| GED | Classement, recherche, versions et droits des documents. |\n| DAS | Axe de stratégie transversal, distinct d’une fonction et d’un menu. |\n| Frontend / Backend | Écrans dans le navigateur / logique et traitement côté serveur. |\n| API | Point de dialogue structuré entre logiciels. |\n| Domaine / DNS / Hébergement | Adresse / annuaire d’orientation / espace qui sert ou exécute le site. |\n| Auth / Permissions | Vérifier qui se connecte / déterminer ce qu’il peut faire. |\n| Base / Entrepôt de données | Stockage structuré / stockage organisé pour historique et analyse. Une sauvegarde reste une copie de secours distincte. |\n| Branche / PR / Déploiement | Travail isolé / proposition de changement à relire / mise à disposition sur un serveur. |\n| Fournisseur / Opérateur / Responsable | Fournit un service / agit sur le système / répond de la décision et de son suivi. |\n| KPI / FX / CRM | Indicateur de pilotage / change monétaire / gestion des relations clients. |\n\n### Repères du cycle de livraison\n\n| Terme | Explication simple |\n|---|---|\n| Dépôt | Dossier central où le code et son historique sont conservés. |\n| Commit | Enregistrement identifié d’un ensemble précis de changements. |\n| Build | Transformation du code en version exécutable ou publiable. |\n| Environnement | Espace séparé où une version est configurée et utilisée : test, preview ou production. |\n| Hébergeur | Fournisseur qui met à disposition les serveurs ou services nécessaires. |\n| Production informatique | Environnement réel utilisé par les personnes autorisées. |\n| Production métier | Fonction M3S consacrée aux commandes, fournisseurs, fabrication, stocks et opérations associées. |\n| Activation | Décision contrôlée qui rend une fonction utilisable dans un périmètre donné. |\n\n<a id=\"fr-sources\"><\/a>\n\n## Sources\n\n**D’où vient chaque information ?**\n\n### Périmètre et date\n\nÉdition V3.1 du 13 septembre 2026. Sources documentaires fournies, configuration du menu et palette lues dans GitHub, observations Hostpoint/HTTP/DNS de cette session, décisions M3S confirmées et confirmation de l’utilisateur. Les preuves quotidiennes citées par S1 n’ont pas toutes été rouvertes ; les statuts correspondants sont donc marqués documentés. La vue n’est pas connectée à une supervision. Français source ; allemand et anglais traduits pour orientation, à relire avant une diffusion institutionnelle.\n\n- **S1** — Inventaire technique M3S V2.2 du 13.09.2026 — source antérieure à cette Boussole V3.1\n- **S2** — ARCHITECTURE_OFFRE M3S_04_07_26.txt\n- **S3** — Architecture_Documents_Directeurs_Et_Strategiques_2SG_M3S.md\n- **S4** — M3S_ARCHITECTURE_AGENTS_FUSIONNEE.md — 17.05.2026\n- **S5** — M3S_ARCHITECTURE_VISUELLE_SYSTEME_04JUIN2026.md + M3S_TECH_STACK_INVENTAIRE_04JUIN2026.md\n- **S6** — [GitHub — menuStructure.json, sidebarMenu.js, designSystem.css · e2141df74a38739fb72ae0902f9cce62894f0a0a](https://github.com/snchgroup-web/m3s-frontend-v2/tree/e2141df74a38739fb72ae0902f9cce62894f0a0a)\n- **S7** — Hostpoint Control Panel · 13.09.2026\n- **S8** — HTTP / DNS · 13.09.2026\n- **S9** — Confirmation Cheikh · 13.09.2026\n- **S10** — M3S-GLOBAL-VUE-001 V0.2 · confirmé le 13.09.2026\n- **S11** — M3S-P2-GOUV-ARB-001 V0.1 · confirmé le 13.09.2026\n- **S12** — M3S-P2-GOUV-BLOC-A-001 V0.1 · candidat préparé le 13.09.2026\n- **S13** — M3S Daily Intelligence V4 et journal · état documentaire du 13.09.2026\n\n### Utilisation et transmission à Codex\n\nOuvrir le HTML dans un navigateur : aucune installation ni connexion requise. Choisir FR/DE/EN, naviguer, rechercher, déplier les menus ou imprimer. Les liens externes demandent Internet. Le Markdown contient le même contenu dans les trois langues. Pour intégration future : conserver les identifiants de sections, le menu sourcé, la date et les statuts ; raccorder aux traductions et permissions M3S ; revalider les sources. Cette livraison n’effectue aucun déploiement M3S et ne modifie aucun service.\n\n---\n\n<a id=\"de\"><\/a>\n\n# Deutsch — Übersetzung\n\n13. September 2026 · Dokumentationsansicht · V3.1\n\n[Übersicht](#de-overview) · [Strategie & Rahmen](#de-strategy) · [Funktionen & Menüs](#de-functions) · [Technisches System](#de-system) · [Stand der Vorhaben](#de-status) · [Entwicklung](#de-evolution) · [Glossar](#de-glossary) · [Quellen](#de-sources)\n\n<a id=\"de-overview\"><\/a>\n\n## Übersicht\n\n**Das Projekt verstehen**\n\n```mermaid\nflowchart TD\nA[\"2SG\"] --> B[\"Zweck & Governance\"]\nA --> C[\"Funktionen & Prozesse\"]\nB --> C\nC --> D[\"M3S · ERP, Daten & Intelligenz\"]\nD --> E[\"Übersicht / Entwicklung\"]\nE -.-> B\n```\n\n### Ein gemeinsamer Kompass\n\n2SG — SeneSwiss Group verbindet die Schweiz und Senegal durch soziale Wirkung, wirtschaftliche Tätigkeit, Zusammenarbeit und digitale Innovation. M3S ist das Management- und Organisationsintelligenzsystem. Das Web-ERP ist ein Bestandteil neben Menschen, Regeln, Prozessen, Daten, Dokumenten und Entscheidungshilfen. [S1, S2]\n\n### Die sieben Betrachtungsebenen\n\n| Ebene | Aufgabe |\n|---|---|\n| Identität & Zweck | Mission, Werte, Inklusion, Wirkung. |\n| Strategie | Positionierung, Geschäftsfelder, Angebot, Geschäftsmodell. |\n| Governance | Generalversammlung, Vorstand, Entscheidungen und institutionelle Verantwortung. |\n| Organisation | Funktionen, Prozesse, Aktivitäten, Teams, Verfahren und Kennzahlen. |\n| M3S-System | ERP, Dokumentenmanagement, Monitoring, Steuerung, Sicherheit und KI. |\n| Technische Umsetzung | Oberfläche, API, Daten, Hosting und Bereitstellung. |\n| Weiterentwicklung | Nachweise, Nutzung, Protokolle und Rückkopplung zu den Prioritäten. |\n\n### Zusammenfassung vom 13. September 2026\n\nEine Webbasis besteht; laut vorherigem Inventar sind mehrere Nutzungen erreicht. Der Funktionsumfang variiert: Finanzen/FX, Verwaltung und ein erstes Personalverzeichnis sind vorangekommen; CRM, Produktion, Anlagen und Teile des Dokumentenmanagements benötigen weitere Arbeit. Reales Budget, reale Bankkonten und PostgreSQL-Auswahl bleiben laut S1 kontrolliert und nicht aktiviert. Spezialisierte Agenten sind ein Zielbild. Vorgeschlagene Priorität: Gesamtbild konsolidieren, Nutzungen und Verantwortliche qualifizieren, danach Aktivierungen entscheiden. Es wird kein globaler Fertigstellungsgrad angegeben.\n\n### Aktueller Steuerungsstand\n\nDas Cockpit M3S-GLOBAL-VUE-001 V0.2 führt 20 Vorhaben: 2 AKTIV, 9 WARTEND, 2 ZURÜCKGESTELLT, 7 GESCHLOSSEN und 0 BLOCKIERT [S10]. Die 22 Maßnahmen zu Villa LR1, Recht, Finanzen und Personal bleiben in gesteuertem Nachweiswarten offen, ohne automatische Wiederaufnahme. P2-GOUV wird nach Ausnahmen bearbeitet; die bestätigte Reihenfolge lautet Aktivität + Reporting, Programm + Verantwortlichkeiten, danach Verwaltung + KPI [S11]. Der manuelle Vertrag des ersten Blocks ist vorbereitet, aber noch nicht bestätigt [S12].\n\n<a id=\"de-strategy\"><\/a>\n\n## Strategie & Rahmen\n\n**Vom Zweck zur Verantwortung**\n\n### Vier strategische Felder\n\n| Feld | Zweck |\n|---|---|\n| Soziales | Solidarität, Inklusion, Bildung und Begleitung. |\n| Business | Einnahmen, Handel, Dienstleistungen und wirtschaftliche Vermögenswerte. |\n| Digital | M3S, Anwendungen, Automatisierung, KI und digitale Angebote. |\n| Governance & Organisation | Rahmen, Koordination, Compliance und Steuerung. |\n\n### Felder, Angebote und Funktionen\n\nDie Felder sind in S1 strategische Querschnittsachsen. Sie ersetzen weder Funktionen noch Menüs. S2 beschreibt intelligente Organisation, Prozessautomatisierung, souveräne KI, KI-Schulung, Social Business und E-Commerce. Die beschriebenen Pakete sind hier nicht als vollständig vermarktet nachgewiesen. FluxConvert, Korrespondenz und Dokumentenmanagement können künftige Angebote unterstützen; LocalPilotSummary ist als nicht angebunden bezeichnet. Frühere Business Units bleiben historische Referenzen.\n\n### Wer entscheidet?\n\nInstitutionelle Lesart von S1: Generalversammlung und Vorstand tragen die Governance. Genaue Mandate und Befugnisse sind anhand der geltenden Statuten, Protokolle und Beschlüsse zu prüfen. Eine Software-Rolle oder ein KI-Assistent ist kein rechtliches Mandat. 2SG setzt Prioritäten und validiert Entscheidungen; Codex arbeitet technisch im beauftragten Umfang. Namentliche Zuständigkeiten für Abonnements, Sicherungen, Daten und Abnahmen sind noch einzutragen.\n\n### Die Dokumentationskette\n\nLeitdokumente → Audit und Synthese → funktionales und operatives Referenzmodell → ERP-Anforderungen → Code und Tests → Nutzung und Nachweise. S3 plant zehn Bereiche: Einstieg; Grundlagen; Leitdokument; Geschäftsmodell/Pläne; Recht; Technik/KI; Audit/Neuausrichtung; Angebot/Marke; Übersetzungen; Archiv. Dies ist eine Zielstruktur, kein Nachweis vollständig vorhandener Ordner. Ein gemeinsamer Kompass verbindet die Quellen, ohne ihre Autorität zu ersetzen.\n\n<a id=\"de-functions\"><\/a>\n\n## Funktionen & Menüs\n\n**Organisation und Zugang in M3S**\n\n### Lesekonvention\n\nFunktionsfamilie = Gruppierung; Funktion = dauerhafte fachliche Verantwortung; Prozess = Folge von Aktivitäten; Modul = Softwarebestandteil; Menü = Zugang zu Ansichten. „Management & Governance“ kann als didaktische Funktionsfamilie dienen; im Code bezeichnet es derzeit eine Navigationsgruppe mit dem Dashboard. Das Dashboard ist ein Steuerungsinstrument. Die organisatorische Zuordnung ist im Referenzmodell zu validieren.\n\n### Exaktes Menü des geprüften Codes\n\nDie folgende Karte übernimmt Gruppen, Bezeichnungen, Untermenüs und Pfade aus menuStructure.json, Commit e2141df74a38 (S6). Sie korrigiert die frühere vereinfachte Darstellung. Im Code vorhanden bedeutet nicht für alle verfügbar: Rechte, Bereitstellung und Aktivierung können den Zugang begrenzen. Das Auditprotokoll verlangt ausdrücklich administration:audit:read. Die Pfade dienen der Orientierung; dieser Kompass führt keine ERP-Funktionen aus.\n\n### Management & Governance\n\n#### Dashboard\n\n`/`\n\n| Alle Untermenüs | M3S-Pfad |\n|---|---|\n| Übersicht | `/?view=overview` |\n| Institutionelles 2SG-Programm | `/?view=program` |\n| Daily Intelligence | `/?view=intelligence` |\n| Funktionskarte | `/?view=map` |\n| Architektur & Beziehungen | `/?view=architecture` |\n| Prozesse & Kontrollen | `/?view=processes` |\n| Vorfälle & Risiken | `/?view=incidents` |\n| Ressourcen | `/?view=resources` |\n| Glossar | `/?view=glossary` |\n\n### Unterstützungsfunktionen\n\n#### Verwaltung\n\n`/administration`\n\n| Alle Untermenüs | M3S-Pfad |\n|---|---|\n| Institution | `/administration?tab=institution` |\n| Architektur & Beziehungen | `/administration?tab=architecture` |\n| Prozesse & Verfahren | `/administration?tab=processes` |\n| Compliance | `/administration?tab=compliance` |\n| Planung & Projekte | `/administration?tab=planning` |\n| Kommunikation & Korrespondenz | `/administration?tab=communication` |\n| Ressourcen | `/administration?tab=resources` |\n| Verwaltungsassistent | `/administration?tab=assistant` |\n| Auditprotokoll · Berechtigung erforderlich | `/administration?tab=audit` |\n| Glossar | `/administration?tab=glossary` |\n\n#### Finanzen\n\n`/finance`\n\n| Alle Untermenüs | M3S-Pfad |\n|---|---|\n| Architektur & Beziehungen | `/finance?tab=architecture` |\n| Prozesse & Verfahren | `/finance?tab=processes` |\n| Einnahmen | `/finance?tab=recettes` |\n| Ausgaben | `/finance?tab=depenses` |\n| Budget | `/finance?tab=budget` |\n| Sozial | `/finance?tab=social` |\n| Immobilienfinanzierung | `/finance?tab=immobilier` |\n| FX-Umrechner | `/finance?tab=fx` |\n| Assistent Finanzen | `/finance?tab=assistant` |\n| Ressourcen | `/finance?tab=resources` |\n| Glossar | `/finance?tab=glossary` |\n\n#### Personalwesen\n\n`/rh`\n\n| Alle Untermenüs | M3S-Pfad |\n|---|---|\n| Architektur & Beziehungen | `/rh?tab=architecture` |\n| Prozesse & Verfahren | `/rh?tab=processes` | oduction?tab=fournisseurs` |\n| Bestände | `/production?tab=stocks` |\n| Assistent Produktion | `/production?tab=assistant` |\n| Ressourcen | `/production?tab=resources` |\n| Glossar | `/production?tab=glossary` |\n\n#### Anlagen & Vermögenswerte\n\n`/actifs`\n\n| Alle Untermenüs | M3S-Pfad |\n|---|---|\n| Architektur & Beziehungen | `/actifs?tab=architecture` |\n| Prozesse & Verfahren | `/actifs?tab=processes` |\n| Bestand | `/actifs?tab=inventory` |\n| Anlagevermögen | `/actifs?tab=immobilisations` |\n| Risiken | `/actifs?tab=risques` |\n| Assistent Bestand & Aktiven | `/actifs?tab=assistant` |\n| Ressourcen | `/actifs?tab=resources` |\n| Glossar | `/actifs?tab=glossary` |\n\n<a id=\"de-system\"><\/a>\n\n## Technisches System\n\n**Wer übernimmt welche Aufgabe?**\n\n### Zwei ergänzende Abläufe\n\nDer Nutzungsablauf verbindet Browser, Oberfläche, API und Daten. Der Entwicklungsablauf verbindet Entwicklungsarbeit, GitHub, Tests und Hosting. E-Mails haben einen eigenen Ablauf bei Hostpoint und laufen nicht zwingend über Netlify. Die Karte beschreibt Beziehungen; sie überwacht keine Dienste in Echtzeit.\n\n```mermaid\nflowchart TD\nU[\"Browser\"] --> N[\"React / Netlify\"]\nN --> R[\"API / Railway · S1\"]\nR --> B[\"BigQuery · S1\"]\nG[\"GitHub\"] --> T[\"Tests & Preview\"]\nT --> N\nT --> R\nH[\"Hostpoint\"] --> M[\"Mail\"]\nH --> W[\"Smart Webhosting\"]\nH --> DB[\"MariaDB · ? M3S\"]\n```\n\nE-Mail hat einen eigenen Ablauf. Keine Verbindung zwischen Hostpoint-Datenbank und M3S nachgewiesen.\n\n### Komponenten und Anbieter\n\n| Komponente / Anbieter | Einfache Erklärung | Stand und Nachweis |\n|---|---|---|\n| Domain · Hostpoint | seneswiss-group.com: Internetadresse, im Konto vorhanden. | Konto geprüft [S7]. Vertrag und Verlängerung zu dokumentieren. |\n| DNS · NS1 / Netlify-Verweis | Verzeichnis, das Domainverkehr zu Diensten leitet. | Öffentliche NS: nsone.net; SOA nennt Netlify [S8]. Verwaltung zu bestätigen. |\n| Mail · Hostpoint Cloud Office | Betreibt geschäftliche Postfächer; getrennt von der M3S-Anmeldung. | 4 Konten gesehen; Cheikh bestätigt die Funktion seines Postfachs [S7,S9]. |\n| Web · Hostpoint Smart Webhosting | Webspace auf sl1797.web.hostpoint.ch; Website edegupaw.myhostpoint.ch mit Apache/PHP. | Hosting und Website-Konfiguration geprüft [S7]. Inhalt und aktuelle Nutzung nicht auditiert. |\n| Oberfläche · React / Netlify | React erstellt Ansichten; Netlify veröffentlicht und liefert sie aus. | HTTP 200 mit server: Netlify für die Domain [S8]. Keine vollständige Abnahme. |\n| Server · Node.js / Express / Railway | Empfängt Anfragen, wendet Regeln an und greift auf Daten zu. | Aktive Architektur in S1 dokumentiert; Livezustand hier nicht erneut geprüft. |\n| Daten · BigQuery / Google Cloud | Historischer und analytischer Datenspeicher. | Aktive Basis dokumentiert [S1]; keine allgemeine Migration nachgewiesen. |\n| Datenbank · Hostpoint MariaDB | Das Panel zeigt eine Datenbank und MariaDB 10.11. | Existenz geprüft [S7]; Inhalt und M3S-Anbindung ungeklärt. |\n| Code · GitHub | Code-Gedächtnis: Versionen, Branches, Reviews und Verlauf. | Frontend geprüft [S6]. Backend- und Cockpit-Repositories identifiziert [S1]. |\n| PostgreSQL / PGlite / Supabase | PostgreSQL ist die relationale Kandidatentechnologie; PGlite diente synthetischen In-Memory-Nachweisen; Supabase wurde nur für begrenzte temporäre Tests verwendet. | Zwei Supabase-E4-Tests endeten mit NO-GO und vollständiger Bereinigung. Zahlung von 27,03 USD gemeldet; keine Rückerstattung oder Gutschrift bestätigt. Kein PostgreSQL-Produktivanbieter, realer Speicher oder Aktivierung ausgewählt. |\n| Akteure · 2SG, Codex, Assistenten | 2SG entscheidet; Codex unterstützt Umsetzung und Prüfung; Assistenten helfen bei Aufgaben. | Rollen beschrieben [S1,S4]. Menschliche Verantwortung bleibt bestehen. |\n\n### Die DNS-/Mail-Abweichung\n\nEine öffentliche MX-Abfrage lieferte kein Ziel, obwohl Postfächer vorhanden sind und Cheikh den langjährigen Betrieb bestätigt. Das isolierte Ergebnis bleibt ungeklärt: Es ist kein Ausfall festgestellt und keine Einstellung geändert worden. Die Nutzungsbestätigung betrifft sein Postfach und ist kein Test aller vier Konten.\n\n### Sicherheit: drei getrennte Fragen\n\n| Frage | Mechanismus | Grenze |\n|---|---|---|\n| Wer sind Sie? | Authentifizierung: Identität und Sitzungs-/API-Token. | S1 beschreibt Bearer-Token; kein Nachweis für Supabase Auth. |\n| Was dürfen Sie tun? | Autorisierung: Rechte nach Rollen und Vorgängen. | Softwarezugang verleiht kein institutionelles Mandat. |\n| Was ist zu schützen? | Geheimnisse außerhalb des Codes; beschränkter Datenzugang; Sicherung und Wiederherstellung. | Dokumentierte Richtlinie ≠ getestete Wiederherstellung. Zuständigkeiten und Nachweise ergänzen. |\n\n### Entwicklungswerkzeuge\n\nS1 nennt React 19, React Router 7, Axios, Recharts, Tailwind CSS 4, Express 4, den BigQuery-Client sowie Node-/Python-Skripte. Dies sind dokumentierte Referenzen, keine Messung aktuell ausgeführter Versionen. SQL fragt Daten ab, JSON überträgt Informationen, Markdown trägt Dokumentation. Git versioniert Änderungen und GitHub hostet Repositories.\n\n<a id=\"de-status\"><\/a>\n\n## Stand der Vorhaben\n\n**Erreichtes, Grenzen und nächste Schritte**\n\n### So lesen Sie den Status\n\nGeprüft: benannte direkte Beobachtung. Vom Nutzer bestätigt: berichtete Nutzung. Dokumentiert: Quellenangabe ohne erneuten Test hier. Zu konsolidieren: teilweise umgesetzt. Zielbild: Orientierung oder Experiment. Nicht aktiviert: ausdrücklich beibehaltene Grenze. Die folgende Matrix übernimmt S1 und ersetzt keine aktuelle Modulabnahme.\n\n### Dokumentierter Stand [S1]\n\n| Vorhaben | Berichteter Fortschritt | Nächster Schritt / Grenze |\n|---|---|---|\n| Strategie / Recht | Audit, Synthese und Referenzmodelle fortgeschritten. | Leitdokument, Angebot, Marke und institutionelle Nachweise konsolidieren. |\n| Oberfläche / Verwaltung | FR/DE/EN, Themes, responsiv; Register und institutioneller Pilot. | UX-Verfügbarkeit, Daten und tatsächliche Befugnisse unterscheiden. |\n| Finanzen / FX | Historie, belegte Kennzahlen und CHF/CFA verbessert. | Abstimmungen und historische Quellen ergänzen; kein „100 %“. |\n| Personalwesen | Erstes Verzeichnis RH-001 als bereitgestellt berichtet. | Der gesamte Personalbereich ist nicht abgeschlossen. |\n| CRM / Produktion / Anlagen | Navigationsansichten und erste Nutzungen. | Echte Daten und Workflows qualifizieren; Vermögen / Villa LR1 offen. |\n| Dokumente / Wissen | Erster Umfang und Dokumenten-Governance berichtet. | Sensible Unterlagen, Herkunft und Aufbewahrung konsolidieren. |\n| Budget / Bankkonten | Verträge, Validierungen und fiktive/maskierte Tests. | Budget-Produktivbetrieb und echte Bankdaten laut S1 nicht geöffnet. |\n| Daily Intelligence / Inbox | Dreisprachige V4 und fiktiver Inbox-Pilot berichtet. | Generierung, Veröffentlichung, Verteilung und institutionelles Programm trennen. |\n| KI-Agenten / externe Angebote | Architektur und begrenzte Tests beschrieben. | Keine allgemeine Autonomie oder Vermarktung nachgewiesen. |\n\n### Globales Cockpit V0.2 [S10-S12]\n\n| Liste | Aktueller Stand | Wiederaufnahmeregel |\n|---|---|---|\n| Gesamtansicht | 20 Vorhaben: 2 AKTIV, 9 WARTEND, 2 ZURÜCKGESTELLT, 7 GESCHLOSSEN, 0 BLOCKIERT. | Bei Entscheidung, Nachweis oder wesentlicher Änderung aktualisieren. |\n| P1-REAL | Villa LR1, Recht, Finanzen und Personal: 22 offene Maßnahmen im gesteuerten Nachweiswarten. | Nur bei neuer menschlicher Information oder ausdrücklich autorisiertem Nachweis. |\n| P2-GOV | Arbitrage bestätigt; Block A Aktivität + Reporting vorbereitet, noch nicht bestätigt. | Gebündelte Bestätigung der acht Entscheidungen von Block A. |\n| P3-TECH / P4-RESERVE | Stiller Bestand während der P2-GOUV-Wiederaufnahme. | Nicht ohne separate Entscheidung öffnen. |\n\n### KI-Zielarchitektur [S4]\n\nStrategic Brain koordiniert spezialisierte Agenten: Monitoring/Wissen, Finanzen/FX, Daten/Reporting, CRM/Beziehungen, PMO/Projekte, Entwicklung/Automatisierung; Handel und digitale Angebote sind spätere Erweiterungen. Der Ablauf lautet Scout → Analyst → Creator → Editor → Publisher. Publisher bereitet die Verteilung vor; menschliche Freigabe geht der Veröffentlichung voraus. Das Dokument beschreibt eine geplante Implementierungsphase, keinen Nachweis, dass alle Agenten laufen.\n\n<a id=\"de-evolution\"><\/a>\n\n## Entwicklung\n\n**Den bisherigen Weg verstehen**\n\n### Datierte Meilensteine\n\n| Datum | Entwicklung | Einordnung |\n|---|---|---|\n| 17.05.2026 | Zusammengeführte Agentenarchitektur. | Zielbild Phase 2 [S4]. |\n| 04.06.2026 | Erstes Inventar und visuelle Architektur. | Historisch: Mengen und „vollständig“ nicht als aktuell übernommen [S5]. |\n| 22.06.2026 | Struktur der Leitdokumente übermittelt. | Zielstruktur [S3]. |\n| 13.09.2026 · V2.2 | Globaler Kompass: Strategie, Betrieb, Technik und Reife. | Vorherige Dokumentationssynthese [S1]. |\n| 13.09.2026 · V3.0 | Hostpoint ergänzt; exaktes Menü; Begriffe geklärt; dreisprachige Offlineansicht. | Neue Ausgabe desselben Kompasses. |\n| 13.09.2026 · V3.1 | Cockpit V0.2, Wiederaufnahmelisten, technischer Ablauf und Supabase-Stand ergänzt. | Kontrollierte Revision der V3.0-Quelle ohne Änderung an M3S. |\n\n### Von der Entwicklung zum Livebetrieb\n\nEntwicklung: bauen oder korrigieren. Test: Verhalten prüfen. Preview/Vorproduktion: Version vor Veröffentlichung prüfen. IT-Produktivbetrieb: Version im realen Einsatz. Fachliche Produktion: Produkt herstellen oder Leistung erbringen — andere Bedeutung. Dokumentierter Ablauf: Bedarf → Branch → Code → Tests → Review/PR → Preview → menschliche Entscheidung → Zusammenführung/Bereitstellung → Nutzungsprüfung → Protokoll. Zusammenführung beweist keine Aktivierung.\n\n### Vom Bedarf zur realen Nutzung\n\n| Schritt | Einfache Frage | Erwartetes Ergebnis |\n|---|---|---|\n| 1. Bedarf | Welches Problem soll gelöst werden? | Klar formulierter Bedarf und erwartetes Ergebnis. |\n| 2. Rahmen | Was tun wir, was nicht, und wer entscheidet? | Umfang, Risiken, Verantwortung und Erfolgskriterien. |\n| 3. Branch und Code | Wie bauen wir, ohne die stabile Version zu stören? | Isolierte und nachvollziehbare Änderungen. |\n| 4. Tests | Ist das erwartete Verhalten geprüft? | Reproduzierbare Ergebnisse und bekannte Abweichungen. |\n| 5. PR und Review | Wurde die Änderung vor dem Zusammenführen geprüft? | Urteil, Korrekturen und menschliche Entscheidung. |\n| 6. Preview | Kann es ohne Produktionsänderung geprüft werden? | Isolierte visuelle und funktionale Abnahme. |\n| 7. Zusammenführung und Bereitstellung | Wird der gewählte Code in der richtigen Umgebung bereitgestellt? | Technische Version verfügbar; nicht zwingend aktiviert. |\n| 8. Aktivierung und Nachweis | Ist die reale Nutzung autorisiert, zugänglich und kontrolliert? | Abnahme, Aktivierungsentscheidung, datierte Nachweise und Protokoll. |\n\n### Vorgeschlagene nächste Schritte\n\n1. Diesen Kompass prüfen und fachliche Zuordnungen validieren. 2. Verantwortliche, Verträge, Verlängerungen, Sicherungen und Nutzung der Hostpoint-Datenbank ergänzen. 3. Authentifizierte Abnahme je Funktion vor einer Vollständigkeitserklärung. 4. Leitdokument, Angebot und Gesamtportfolio konsolidieren. 5. PostgreSQL-Anbieter und Budget-/Bankaktivierungen getrennt entscheiden. 6. Integration des Kompasses in M3S vorbereiten. Nach wesentlichen Änderungen aktualisieren; vierteljährlicher Rhythmus noch zu vereinbaren, keine Automation eingerichtet.\n\n<a id=\"de-glossary\"><\/a>\n\n## Glossar\n\n**Begriffe zur Orientierung**\n\n### Rolle dieser Definitionen\n\nDiese Kurzdefinitionen dienen der Orientierung nichttechnischer Nutzer. Sie ersetzen nicht das zentrale 2SG-Glossar als maßgebliche Quelle. Jeder neue oder dauerhaft geänderte Begriff muss vor Veröffentlichung die Terminologie-Prüfliste GLO-TECH-01 durchlaufen.\n\n### Orientierung ohne Fachjargon\n\n| Begriff | Erklärung |\n|---|---|\n| ERP | Software, die mehrere Managementaktivitäten verbindet. |\n| Dokumentenmanagement (GED) | Ablage, Suche, Versionen und Zugriffsrechte für Dokumente. |\n| Strategisches Geschäftsfeld (DAS) | Strategische Querschnittsachse, getrennt von Funktion und Menü. |\n| Frontend / Backend | Browseransichten / Logik und Verarbeitung auf dem Server. |\n| API | Strukturierte Schnittstelle zwischen Programmen. |\n| Domain / DNS / Hosting | Adresse / Wegweiser / Speicher- und Ausführungsort der Website. |\n| Auth / Berechtigungen | Identität prüfen / erlaubte Aktionen bestimmen. |\n| Datenbank / Data Warehouse | Strukturierter Speicher / für Historie und Analyse organisierter Speicher. Ein Backup ist eine separate Sicherungskopie. |\n| Branch / PR / Bereitstellung | Isolierter Arbeitsstand / Änderungsvorschlag zur Prüfung / Bereitstellung auf einem Server. |\n| Anbieter / Betreiber / Verantwortlicher | Liefert einen Dienst / bedient das System / verantwortet Entscheidung und Nachverfolgung. |\n| KPI / FX / CRM | Steuerungskennzahl / Währungsumrechnung / Kundenbeziehungsmanagement. |\n\n### Begriffe des Lieferzyklus\n\n| Begriff | Einfache Erklärung |\n|---|---|\n| Repository | Zentraler Ort für Code und Versionsgeschichte. |\n| Commit | Identifizierte Aufzeichnung eines bestimmten Änderungssatzes. |\n| Build | Umwandlung des Codes in eine ausführbare oder veröffentlichbare Version. |\n| Umgebung | Getrennter Bereich, in dem eine Version konfiguriert und genutzt wird: Test, Preview oder Produktion. |\n| Hosting-Anbieter | Anbieter der erforderlichen Server oder Dienste. |\n| IT-Produktivbetrieb | Reale Umgebung für autorisierte Nutzer. |\n| Fachliche Produktion | M3S-Funktion für Bestellungen, Lieferanten, Fertigung, Bestände und zugehörige Abläufe. |\n| Aktivierung | Kontrollierte Entscheidung, die eine Funktion in einem bestimmten Umfang nutzbar macht. |\n\n<a id=\"de-sources\"><\/a>\n\n## Quellen\n\n**Woher stammt jede Information?**\n\n### Umfang und Datum\n\nAusgabe V3.1 vom 13. September 2026. Bereitgestellte Dokumente, Menü und Palette aus GitHub, Hostpoint-/HTTP-/DNS-Beobachtungen dieser Sitzung, bestätigte M3S-Entscheidungen und Nutzerbestätigung. Nicht alle von S1 genannten täglichen Nachweise wurden erneut geöffnet; entsprechende Zustände sind daher als dokumentiert gekennzeichnet. Keine Liveüberwachung. Französisch ist die Ausgangsfassung; Deutsch und Englisch dienen der Orientierung und sollten vor institutioneller Verteilung geprüft werden.\n\n- **S1** — Inventaire technique M3S V2.2 du 13.09.2026 — source antérieure à cette Boussole V3.1\n- **S2** — ARCHITECTURE_OFFRE M3S_04_07_26.txt\n- **S3** — Architecture_Documents_Directeurs_Et_Strategiques_2SG_M3S.md\n- **S4** — M3S_ARCHITECTURE_AGENTS_FUSIONNEE.md — 17.05.2026\n- **S5** — M3S_ARCHITECTURE_VISUELLE_SYSTEME_04JUIN2026.md + M3S_TECH_STACK_INVENTAIRE_04JUIN2026.md\n- **S6** — [GitHub — menuStructure.json, sidebarMenu.js, designSystem.css · e2141df74a38739fb72ae0902f9cce62894f0a0a](https://github.com/snchgroup-web/m3s-frontend-v2/tree/e2141df74a38739fb72ae0902f9cce62894f0a0a)\n- **S7** — Hostpoint Control Panel · 13.09.2026\n- **S8** — HTTP / DNS · 13.09.2026\n- **S9** — Confirmation Cheikh · 13.09.2026\n- **S10** — M3S-GLOBAL-VUE-001 V0.2 · confirmé le 13.09.2026\n- **S11** — M3S-P2-GOUV-ARB-001 V0.1 · confirmé le 13.09.2026\n- **S12** — M3S-P2-GOUV-BLOC-A-001 V0.1 · candidat préparé le 13.09.2026\n- **S13** — M3S Daily Intelligence V4 et journal · état documentaire du 13.09.2026\n\n### Nutzung und Übergabe an Codex\n\nHTML im Browser öffnen: keine Installation oder Anmeldung nötig. FR/DE/EN wählen, navigieren, suchen, Menüs aufklappen oder drucken. Externe Links benötigen Internet. Markdown enthält denselben Inhalt in drei Sprachen. Für spätere Integration: Abschnitts-IDs, belegtes Menü, Datum und Status erhalten; mit M3S-Übersetzungen und Berechtigungen verbinden; Quellen erneut prüfen. Diese Lieferung stellt nichts in M3S bereit und ändert keine Dienste.\n\n---\n\n<a id=\"en\"><\/a>\n\n# English — translation\n\n13 September 2026 · Documentary view · V3.1\n\n[Overview](#en-overview) · [Strategy & framework](#en-strategy) · [Functions & menus](#en-functions) · [Technical system](#en-system) · [Workstream status](#en-status) · [Evolution](#en-evolution) · [Glossary](#en-glossary) · [Sources](#en-sources)\n\n<a id=\"en-overview\"><\/a>\n\n## Overview\n\n**Understand the project**\n\n```mermaid\nflowchart TD\nA[\"2SG\"] --> B[\"Purpose & governance\"]\nA --> C[\"Functions & processes\"]\nB --> C\nC --> D[\"M3S · ERP, data & intelligence\"]\nD --> E[\"Overview / Evolution\"]\nE -.-> B\n```\n\n### A shared compass\n\n2SG — SeneSwiss Group connects Switzerland and Senegal through social impact, economic activity, cooperation and digital innovation. M3S is its management and organisational intelligence system. The web ERP is one component alongside people, rules, processes, data, documents and decision-support tools. [S1, S2]\n\n### Seven levels of understanding\n\n| Level | Role |\n|---|---|\n| Identity & purpose | Mission, values, inclusion, impact. |\n| Strategy | Positioning, strategic domains, offer, business model. |\n| Governance | General Assembly, Board, decisions and institutional accountability. |\n| Organisation | Functions, processes, activities, teams, procedures and KPIs. |\n| M3S system | ERP, document management, intelligence, steering, security and AI. |\n| Technical implementation | Interface, API, data, hosting and deployment. |\n| Evolution | Evidence, usage, journals and feedback into priorities. |\n\n### Executive summary — 13 September 2026\n\nA web foundation exists and the previous inventory records several established uses. Functional depth varies: Finance/FX, Administration and an initial HR directory have progressed; CRM, Production, Stock & Assets and some document workflows need consolidation. Live budgeting, real bank accounts and the PostgreSQL choice remain controlled and unactivated according to S1. Specialised agents remain a target architecture. Proposed priority: consolidate the overall picture, qualify usage and ownership, then decide on further activation. No overall completion percentage is assigned.\n\n### Current steering reference\n\nThe M3S-GLOBAL-VUE-001 V0.2 cockpit lists 20 workstreams: 2 ACTIVE, 9 WAITING, 2 DEFERRED, 7 CLOSED and 0 BLOCKED [S10]. The 22 Villa LR1, LEGAL, Finance and HR actions remain open in governed evidence waiting, with no automatic restart. P2-GOUV resumes by exception; its confirmed order is Activity + Reporting, Programme + Responsibilities, then Administration + KPI [S11]. The manual contract for the first block is prepared but still awaiting confirmation [S12].\n\n<a id=\"en-strategy\"><\/a>\n\n## Strategy & framework\n\n**From purpose to accountability**\n\n### Four strategic domains\n\n| Domain | Purpose |\n|---|---|\n| Social | Solidarity, inclusion, training and support. |\n| Business | Revenue, commerce, services and economic assets. |\n| Digital | M3S, applications, automation, AI and digital offers. |\n| Governance & Organisation | Framework, coordination, compliance and oversight. |\n\n### Domains, offers and functions\n\nS1 uses these domains as cross-cutting strategic axes. They do not replace functions or menus. S2 describes intelligent organisation, business automation, sovereign AI, AI training, social business and e-commerce. These are documented offers and packages, without evidence here that every offer is being sold. FluxConvert, Correspondence and document management may support future offers; LocalPilotSummary is described as unconnected. Former business units remain historical references.\n\n### Who decides?\n\nS1 places governance with the General Assembly and Board. Exact mandates and powers must be checked against applicable statutes, minutes and decisions. A software role or AI assistant is not a legal mandate. 2SG sets priorities and validates decisions; Codex operates technically within the assigned scope. Named owners for subscriptions, backups, data and acceptance checks remain to be recorded.\n\n### The document chain\n\nGoverning documents → audit and synthesis → functional and operational reference model → ERP requirements → code and tests → usage and evidence. S3 proposes ten areas: start here; foundations; master document; business model/plans; legal; technology/AI; audit/restructuring; offer/branding; translations; archives. This is a target structure, not proof that all folders exist. One compass links the sources without replacing their authority.\n\n<a id=\"en-functions\"><\/a>\n\n## Functions & menus\n\n**The organisation and its M3S entry points**\n\n### Reading convention\n\nFunction family = grouping; function = enduring business responsibility; process = sequence of activities; module = software component; menu = entry point to screens. “Management & Governance” can serve as a teaching category; in the code it currently names a navigation group containing the Dashboard. The Dashboard is a steering tool. Organisational mappings require validation in the reference model.\n\n### Exact menu in the inspected code\n\nThe map below reproduces groups, labels, submenus and paths from menuStructure.json at commit e2141df74a38 (S6), correcting the previous simplified diagram. Present in code does not mean available to everyone: permissions, deployment and activation may restrict access. The audit log explicitly requires administration:audit:read. Paths are reference points; this compass does not execute ERP functions.\n\n### Management & Governance\n\n#### Dashboard\n\n`/`\n\n| All submenus | M3S path |\n|---|---|\n| Overview | `/?view=overview` |\n| 2SG Institutional programme | `/?view=program` |\n| Daily Intelligence | `/?view=intelligence` |\n| Function map | `/?view=map` |\n| Architecture & Relationships | `/?view=architecture` |\n| Processes & Controls | `/?view=processes` |\n| Incidents & Risks | `/?view=incidents` |\n| Resources | `/?view=resources` |\n| Glossary | `/?view=glossary` |\n\n### Support functions\n\n#### Administration\n\n`/administration`\n\n| All submenus | M3S path |\n|---|---|\n| Institution | `/administration?tab=institution` |\n| Architecture & Relationships | `/administration?tab=architecture` |\n| Processes & Procedures | `/administration?tab=processes` |\n| Compliance | `/administration?tab=compliance` |\n| Planning & Projects | `/administration?tab=planning` |\n| Communication & Correspondence | `/administration?tab=communication` |\n| Resources | `/administration?tab=resources` |\n| Administrative assistant | `/administration?tab=assistant` |\n| Audit log · Permission required | `/administration?tab=audit` |\n| Glossary | `/administration?tab=glossary` |\n\n#### Finance\n\n`/finance`\n\n| All submenus | M3S path |\n|---|---|\n| Architecture & Relations | `/finance?tab=architecture` |\n| Processes & Procedures | `/finance?tab=processes` |\n| Revenue | `/finance?tab=recettes` |\n| Expenses | `/finance?tab=depenses` |\n| Budget | `/finance?tab=budget` |\n| Social | `/finance?tab=social` |\n| Real Estate Finance | `/finance?tab=immobilier` |\n| FX Converter | `/finance?tab=fx` |\n| Finance Assistant | `/finance?tab=assistant` |\n| Resources | `/finance?tab=resources` |\n| Glossary | `/finance?tab=glossary` |\n\n#### Human Resources\n\n`/rh`\n\n| All submenus | M3S path |\n|---|---|\n| Architecture & Relations | `/rh?tab=architecture` |\n| Processes & Procedures | `/rh?tab=processes` |\n| Internal directory | `/rh?tab=directory` |\n| Teams & Profiles | `/rh?tab=teams` |\n| Hours & Activities | `/rh?tab=hours` |\n| Skills | `/rh?tab=competences` |\n| My Account | `/rh?tab=myaccount` |\n| HR Assistant | `/rh?tab=assistant` |\n| Resources | `/rh?tab=resources` |\n| Glossary | `/rh?tab=glossary` |\n\n#### IT & Support\n\n`/ged`\n\n| All submenus | M3S path |\n|---|---|\n| Architecture & Relations | `/ged?tab=architecture` |\n| Processes & Procedures | `/ged?tab=processes` |\n| Document Management | `/ged?tab=documents` |\n| Folders | `/ged?tab=dossiers` |\n| Archives | `/ged?tab=archives` |\n| Document tools | `/ged?tab=outils-documents` |\n| Monitoring & Knowledge Management | `/ged?tab=knowledge` |\n| AI & Digital | `/ged?tab=ai-digital` |\n| Database Management | `/ged?tab=database` |\n| User Guide | `/ged?tab=user-guide` |\n| Technical Documentation | `/ged?tab=tech-docs` |\n| Help & Support | `/ged?tab=help-support` |\n| User Manual | `/ged?tab=manual` |\n| IT & Support Assistant | `/ged?tab=assistant` |\n| Resources | `/ged?tab=resources` |\n| Glossary | `/ged?tab=glossary` |\n\n### Operations & Development\n\n#### Commercial & CRM\n\n`/crm`\n\n| All submenus | M3S path |\n|---|---|\n| Architecture & Relations | `/crm?tab=architecture` |\n| Processes & Procedures | `/crm?tab=processes` |\n| Prospects & Leads | `/crm?tab=prospects` |\n| Clients | `/crm?tab=clients` |\n| Sales | `/crm?tab=ventes` |\n| Donations | `/crm?tab=dons` |\n| Beneficiaries | `/crm?tab=beneficiaires` |\n| Commercial Assistant | `/crm?tab=assistant` |\n| Resources | `/crm?tab=resources` |\n| Glossary | `/crm?tab=glossary` |\n\n#### Production\n\n`/production`\n\n| All submenus | M3S path |\n|---|---|\n| Architecture & Relations | `/production?tab=architecture` |\n| Processes & Procedures | `/production?tab=processes` |\n| Orders | `/production?tab=commandes` |\n| Manufacturing | `/production?tab=manufacturing` |\n| Suppliers | `/production?tab=fournisseurs` |\n| Stock | `/production?tab=stocks` |\n| Production Assistant | `/production?tab=assistant` |\n| Resources | `/production?tab=resources` |\n| Glossary | `/production?tab=glossary` |\n\n#### Stock & Assets\n\n`/actifs`\n\n| All submenus | M3S path |\n|---|---|\n| Architecture & Relations | `/actifs?tab=architecture` |\n| Processes & Procedures | `/actifs?tab=processes` |\n| Inventory | `/actifs?tab=inventory` |\n| Fixed Assets | `/actifs?tab=immobilisations` |\n| Risks | `/actifs?tab=risques` |\n| Stock & Assets Assistant | `/actifs?tab=assistant` |\n| Resources | `/actifs?tab=resources` |\n| Glossary | `/actifs?tab=glossary` |\n\n<a id=\"en-system\"><\/a>\n\n## Technical system\n\n**Who does what in the chain?**\n\n### Two complementary flows\n\nThe usage flow links browser, interface, API and data. The delivery flow links development work, GitHub, tests and hosting. Email has its own flow at Hostpoint and does not necessarily pass through Netlify. The map describes relationships; it does not monitor services live.\n\n```mermaid\nflowchart TD\nU[\"Browser\"] --> N[\"React / Netlify\"]\nN --> R[\"API / Railway · S1\"]\nR --> B[\"BigQuery · S1\"]\nG[\"GitHub\"] --> T[\"Tests & preview\"]\nT --> N\nT --> R\nH[\"Hostpoint\"] --> M[\"Mail\"]\nH --> W[\"Smart Webhosting\"]\nH --> DB[\"MariaDB · ? M3S\"]\n```\n\nEmail follows its own flow. No connection between the Hostpoint database and M3S has been established.\n\n### Components and providers\n\n| Component / provider | Plain-language role | State and evidence |\n|---|---|---|\n| Domain · Hostpoint | seneswiss-group.com: Internet address present in the account. | Account inspected [S7]. Contract and renewal to document. |\n| DNS · NS1 / Netlify reference | Directory routing domain traffic to services. | Public NS: nsone.net; SOA mentions Netlify [S8]. Effective administration to confirm. |\n| Mail · Hostpoint Cloud Office | Hosts business mailboxes; separate from M3S sign-in. | 4 accounts observed; Cheikh confirms his mailbox works [S7,S9]. |\n| Web · Hostpoint Smart Webhosting | Web space on sl1797.web.hostpoint.ch; edegupaw.myhostpoint.ch website with Apache/PHP. | Hosting and website configuration verified [S7]. Content and current website usage not audited. |\n| Interface · React / Netlify | React builds screens; Netlify publishes and serves the web version. | HTTP 200 with server: Netlify for the domain [S8]. No full acceptance test. |\n| Server · Node.js / Express / Railway | Receives requests, applies rules and communicates with data. | Active architecture documented in S1; live state not rechecked here. |\n| Data · BigQuery / Google Cloud | Historical and analytical data warehouse. | Documented active foundation [S1]; no general migration demonstrated. |\n| Database · Hostpoint MariaDB | The panel shows one database and MariaDB 10.11. | Existence verified [S7]; content and M3S connection unestablished. |\n| Code · GitHub | Code memory: versions, branches, reviews and history. | Frontend inspected [S6]. Backend and cockpit repositories identified [S1]. |\n| PostgreSQL / PGlite / Supabase | PostgreSQL is the candidate relational technology; PGlite supported synthetic in-memory proofs; Supabase was used only for bounded ephemeral trials. | Two Supabase E4 trials ended NO-GO and were fully cleaned up. A USD 27.03 payment is reported; no refund or account credit is confirmed. No production PostgreSQL provider, real storage or activation has been selected. |\n| Operators · 2SG, Codex, assistants | 2SG decides; Codex helps implement and verify; assistants support tasks. | Roles described [S1,S4]. Human accountability remains in place. |\n\n### The DNS/email discrepancy\n\nA public MX query returned no destination, while mailboxes exist and Cheikh confirms long-standing working usage. This isolated result remains unexplained: no outage is established and no settings were changed. His confirmation concerns his mailbox; it is not a test of all four accounts.\n\n### Security: three separate questions\n\n| Question | Mechanism | Limit |\n|---|---|---|\n| Who are you? | Authentication: identity and session/API token. | S1 describes Bearer tokens; this is not evidence of Supabase Auth. |\n| What may you do? | Authorisation: permissions by role and operation. | Software access does not grant an institutional mandate. |\n| What needs protection? | Secrets outside code; restricted sensitive data; backup and recovery. | Documented policy ≠ tested recovery. Owners and evidence need completion. |\n\n### Development tools\n\nS1 describes React 19, React Router 7, Axios, Recharts, Tailwind CSS 4, Express 4, the BigQuery client and Node/Python scripts. These versions are documentary references, not measurements of the versions running today. SQL queries data; JSON exchanges information; Markdown carries documentation. Git versions changes and GitHub hosts repositories.\n\n<a id=\"en-status\"><\/a>\n\n## Workstream status\n\n**Progress, boundaries and next steps**\n\n### How to read status\n\nVerified: identified direct observation. User-confirmed: reported usage. Documented: source-reported state without retesting here. To consolidate: partial implementation. Target: direction or experiment. Not activated: explicit boundary retained. The following matrix reflects S1 and does not replace current module acceptance testing.\n\n### Documentary snapshot [S1]\n\n| Workstream | Reported progress | Next step / boundary |\n|---|---|---|\n| Strategy / legal | Audit, synthesis and reference models advanced. | Consolidate master document, offer, branding and institutional evidence. |\n| Interface / Administration | FR/DE/EN, themes, responsive UI; registers and institutional pilot. | Distinguish UI availability, data and actual powers. |\n| Finance / FX | History, sourced KPIs and CHF/CFA improved. | Reconciliation and historical sources need completion; no “100%” claim. |\n| HR | Initial RH-001 directory reported deployed. | The complete HR domain is not finished. |\n| CRM / Production / Assets | Navigation surfaces and initial uses. | Qualify real data and workflows; assets / Villa LR1 remain open. |\n| Documents / knowledge | Initial delivery and document governance reported. | Consolidate sensitive records, provenance and retention. |\n| Budget / bank accounts | Contracts, validation and fictional/masked tests. | Budget production and real banking data not opened according to S1. |\n| Daily Intelligence / Inbox | Trilingual V4 and fictional Inbox pilot reported. | Separate generation, publication, distribution and institutional programme. |\n| AI agents / external offers | Architecture and bounded trials described. | No general autonomy or commercialisation proven. |\n\n### Global cockpit V0.2 [S10-S12]\n\n| Queue | Current state | Resume rule |\n|---|---|---|\n| Global view | 20 workstreams: 2 ACTIVE, 9 WAITING, 2 DEFERRED, 7 CLOSED, 0 BLOCKED. | Update after a decision, evidence item or major change. |\n| P1-REAL | Villa LR1, LEGAL, Finance and HR: 22 open actions in governed evidence waiting. | Only on new human information or specifically authorised evidence. |\n| P2-GOV | Arbitration confirmed; Block A Activity + Reporting prepared, not yet confirmed. | Grouped confirmation of the eight Block A decisions. |\n| P3-TECH / P4-RESERVE | Held quietly while P2-GOUV resumes. | Do not open without a separate decision. |\n\n### Target AI architecture [S4]\n\nStrategic Brain coordinates specialised agents: Intelligence/Knowledge, Finance/FX, Data/Reporting, CRM/Relations, PMO/Projects, Development/Automation; Commerce and Digital Offers are future extensions. The flow is Scout → Analyst → Creator → Editor → Publisher. Publisher prepares distribution; human validation precedes publication. The document describes a planned implementation phase, not proof that all agents are running.\n\n<a id=\"en-evolution\"><\/a>\n\n## Evolution\n\n**Understand the journey so far**\n\n### Dated milestones\n\n| Date | Change | Qualification |\n|---|---|---|\n| 2026-05-17 | Merged agent architecture. | Phase 2 target [S4]. |\n| 2026-06-04 | Initial inventory and visual architecture. | Historical: counts and “complete” claims not reused as current facts [S5]. |\n| 2026-06-22 | Governing document architecture supplied. | Target structure [S3]. |\n| 2026-09-13 · V2.2 | Global compass: strategy, operations, technology and maturity. | Previous documentary synthesis [S1]. |\n| 2026-09-13 · V3.0 | Hostpoint restored; exact menu; clarified terms; trilingual standalone view. | New edition of the same compass. |\n| 2026-09-13 · V3.1 | Cockpit V0.2, resume queues, technical journey and Supabase state added. | Controlled revision of the V3.0 source, with no M3S change. |\n\n### From development to live service\n\nDevelopment: build or fix. Testing: check behaviour. Preview/preproduction: inspect a version before release. IT production: version used in real operations. Business production: manufacture a product or deliver a service — a different meaning. Documented flow: need → branch → code → tests → review/PR → preview → human decision → merge/deploy → usage verification → journal. A merge does not prove activation.\n\n### From need to real use\n\n| Stage | Plain question | Expected result |\n|---|---|---|\n| 1. Need | What problem should be solved? | A clearly stated need and expected outcome. |\n| 2. Framing | What is in, what is out, and who decides? | Scope, risks, owner and success criteria. |\n| 3. Branch and code | How do we build without disturbing the stable version? | Isolated, traceable changes. |\n| 4. Tests | Is the expected behaviour verified? | Reproducible results and known gaps. |\n| 5. PR and review | Was the change reviewed before merge? | Verdict, corrections and human decision. |\n| 6. Preview | Can it be tried without touching production? | Isolated visual and functional acceptance. |\n| 7. Merge and deployment | Is the selected code released to the right environment? | Technical version available, not necessarily activated. |\n| 8. Activation and evidence | Is real use authorised, accessible and controlled? | Acceptance, activation decision, dated evidence and journal. |\n\n### Proposed next steps\n\n1. Review this compass and validate business mappings. 2. Complete owners, contracts, renewals, backups and Hostpoint database usage. 3. Run authenticated acceptance checks by function before declaring a domain complete. 4. Consolidate the master document, offer and overall portfolio. 5. Decide separately on the PostgreSQL provider and budget/banking activation. 6. Prepare compass integration into M3S. Update after major changes; quarterly cadence remains to be agreed, with no automation created.\n\n<a id=\"en-glossary\"><\/a>\n\n## Glossary\n\n**Words that help you navigate**\n\n### Role of these definitions\n\nThese short definitions help non-technical readers navigate. They do not replace the central 2SG Glossary, which remains the master source. Any new or lasting term change must pass through the GLO-TECH-01 terminology validation queue before publication.\n\n### Plain-language reference\n\n| Term | Explanation |\n|---|---|\n| ERP | Software connecting several organisational management activities. |\n| Document management (GED) | Document filing, search, versions and access rights. |\n| Strategic domain (DAS) | Cross-cutting strategic axis, distinct from a function or menu. |\n| Frontend / Backend | Browser screens / server-side logic and processing. |\n| API | Structured communication interface between software systems. |\n| Domain / DNS / Hosting | Address / routing directory / space that serves or runs a website. |\n| Auth / permissions | Check who signs in / determine what they may do. |\n| Database / data warehouse | Structured storage / storage organised for history and analysis. A backup remains a separate recovery copy. |\n| Branch / PR / deployment | Isolated work / change proposal for review / release to a server. |\n| Provider / operator / accountable owner | Supplies a service / operates the system / owns the decision and follow-through. |\n| KPI / FX / CRM | Performance indicator / foreign exchange / customer relationship management. |\n\n### Delivery-cycle reference\n\n| Term | Plain explanation |\n|---|---|\n| Repository | Central place where code and its history are kept. |\n| Commit | Identified record of a specific set of changes. |\n| Build | Transformation of code into a runnable or publishable version. |\n| Environment | Separate space where a version is configured and used: test, preview or production. |\n| Hosting provider | Provider supplying the required servers or services. |\n| IT production | Real environment used by authorised people. |\n| Business production | M3S function for orders, suppliers, manufacturing, stock and related operations. |\n| Activation | Controlled decision making a function usable within a defined scope. |\n\n<a id=\"en-sources\"><\/a>\n\n## Sources\n\n**Where does each statement come from?**\n\n### Scope and date\n\nV3.1 edition dated 13 September 2026. Supplied documents, menu and palette read from GitHub, Hostpoint/HTTP/DNS observations in this session, confirmed M3S decisions and user confirmation. Not all daily evidence referenced by S1 was reopened; corresponding states are therefore marked documented. This view is not connected to live monitoring. French is the source; German and English are orientation translations to review before institutional distribution.\n\n- **S1** — Inventaire technique M3S V2.2 du 13.09.2026 — source antérieure à cette Boussole V3.1\n- **S2** — ARCHITECTURE_OFFRE M3S_04_07_26.txt\n- **S3** — Architecture_Documents_Directeurs_Et_Strategiques_2SG_M3S.md\n- **S4** — M3S_ARCHITECTURE_AGENTS_FUSIONNEE.md — 17.05.2026\n- **S5** — M3S_ARCHITECTURE_VISUELLE_SYSTEME_04JUIN2026.md + M3S_TECH_STACK_INVENTAIRE_04JUIN2026.md\n- **S6** — [GitHub — menuStructure.json, sidebarMenu.js, designSystem.css · e2141df74a38739fb72ae0902f9cce62894f0a0a](https://github.com/snchgroup-web/m3s-frontend-v2/tree/e2141df74a38739fb72ae0902f9cce62894f0a0a)\n- **S7** — Hostpoint Control Panel · 13.09.2026\n- **S8** — HTTP / DNS · 13.09.2026\n- **S9** — Confirmation Cheikh · 13.09.2026\n- **S10** — M3S-GLOBAL-VUE-001 V0.2 · confirmé le 13.09.2026\n- **S11** — M3S-P2-GOUV-ARB-001 V0.1 · confirmé le 13.09.2026\n- **S12** — M3S-P2-GOUV-BLOC-A-001 V0.1 · candidat préparé le 13.09.2026\n- **S13** — M3S Daily Intelligence V4 et journal · état documentaire du 13.09.2026\n\n### Usage and handoff to Codex\n\nOpen the HTML in a browser: no installation or sign-in required. Choose FR/DE/EN, navigate, search, expand menus or print. External links need Internet. Markdown contains the same content in all three languages. For later integration: preserve section IDs, sourced menu, date and status; connect to M3S translations and permissions; revalidate sources. This delivery does not deploy to M3S or change any services.\n\n---\n"],{type:'text/markdown;charset=utf-8'}));a.href=url;a.download='M3S_BOUSSOLE_REFERENCE_TRILINGUE_V3_1_2026-09-13.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
