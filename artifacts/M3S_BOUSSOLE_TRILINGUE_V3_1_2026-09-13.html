<script id="data" type="application/json">{"version": "3.1", "date": "2026-09-13", "sections": [{"id": "overview", "title": {"FR": "Vue d’ensemble", "DE": "Übersicht", "EN": "Overview"}, "intro": {"FR": "Comprendre le projet", "DE": "Das Projekt verstehen", "EN": "Understand the project"}, "blocks": [{"type": "prose", "title": {"FR": "Une boussole commune", "DE": "Ein gemeinsamer Kompass", "EN": "A shared compass"}, "body": {"FR": "2SG — SeneSwiss Group porte un projet hybride Suisse–Sénégal : impact social, activités économiques, coopération et innovation numérique. M3S est son système de management et d’intelligence organisationnelle. L’ERP web en est une composante, aux côtés des personnes, règles, processus, données, documents et outils d’aide à la décision. [S1, S2]", "DE": "2SG — SeneSwiss Group verbindet die Schweiz und Senegal durch soziale Wirkung, wirtschaftliche Tätigkeit, Zusammenarbeit und digitale Innovation. M3S ist das Management- und Organisationsintelligenzsystem. Das Web-ERP ist ein Bestandteil neben Menschen, Regeln, Prozessen, Daten, Dokumenten und Entscheidungshilfen. [S1, S2]", "EN": "2SG — SeneSwiss Group connects Switzerland and Senegal through social impact, economic activity, cooperation and digital innovation. M3S is its management and organisational intelligence system. The web ERP is one component alongside people, rules, processes, data, documents and decision-support tools. [S1, S2]"}}, {"type": "table", "title": {"FR": "Les sept niveaux de lecture", "DE": "Die sieben Betrachtungsebenen", "EN": "Seven levels of understanding"}, "heads": {"FR": ["Niveau", "Rôle"], "DE": ["Ebene", "Aufgabe"], "EN": ["Level", "Role"]}, "rows": [[{"FR": "Identité & finalité", "DE": "Identität & Zweck", "EN": "Identity & purpose"}, {"FR": "Mission, valeurs, inclusion, impact.", "DE": "Mission, Werte, Inklusion, Wirkung.", "EN": "Mission, values, inclusion, impact."}], [{"FR": "Stratégie", "DE": "Strategie", "EN": "Strategy"}, {"FR": "Positionnement, DAS, o ns usages GED restent à consolider. Budget réel, comptes bancaires réels et choix PostgreSQL restent encadrés et non activés selon S1. Les agents spécialisés sont une architecture cible. Priorité proposée : consolider la vision globale, qualifier les usages et leurs responsables, puis décider des prochaines activations. Aucun pourcentage global d’achèvement n’est attribué.", "DE": "Eine Webbasis besteht; laut vorherigem Inventar sind mehrere Nutzungen erreicht. Der Funktionsumfang variiert: Finanzen/FX, Verwaltung und ein erstes Personalverzeichnis sind vorangekommen; CRM, Produktion, Anlagen und Teile des Dokumentenmanagements benötigen weitere Arbeit. Reales Budget, reale Bankkonten und PostgreSQL-Auswahl bleiben laut S1 kontrolliert und nicht aktiviert. Spezialisierte Agenten sind ein Zielbild. Vorgeschlagene Priorität: Gesamtbild konsolidieren, Nutzungen und Verantwortliche qualifizieren, danach Aktivierungen entscheiden. Es wird kein globaler Fertigstellungsgrad angegeben.", "EN": "A web foundation exists and the previous inventory records several established uses. Functional depth varies: Finance/FX, Administration and an initial HR directory have progressed; CRM, Production, Stock & Assets and some document workflows need consolidation. Live budgeting, real bank accounts and the PostgreSQL choice remain controlled and unactivated according to S1. Specialised agents remain a target architecture. Proposed priority: consolidate the overall picture, qualify usage and ownership, then decide on further activation. No overall completion percentage is assigned."}}, {"type": "prose", "title": {"FR": "Repère de pilotage actuel", "DE": "Aktueller Steuerungsstand", "EN": "Current steering reference"}, "body": {"FR": "Le cockpit M3S-GLOBAL-VUE-001 V0.2 recense 20 chantiers : 2 ACTIF, 9 ATTENTE, 2 DIFFÉRÉ, 7 FERMÉ et 0 BLOQUÉ [S10]. Les 22 actions Villa LR1, LEGAL, Finances et RH restent ouvertes en attente probatoire gouvernée, sans reprise automatique. La reprise P2-GOUV est organisée par exceptions ; son ordre confirmé est Activité + Reporting, Programme + Responsabilités, puis Administration + KPI [S11]. Le contrat manuel du premier bloc est préparé mais attend encore sa confirmation [S12].", "DE": "Das Cockpit M3S-GLOBAL-VUE-001 V0.2 führt 20 Vorhaben: 2 AKTIV, 9 WARTEND, 2 ZURÜCKGESTELLT, 7 GESCHLOSSEN und 0 BLOCKIERT [S10]. Die 22 Maßnahmen zu Villa LR1, Recht, Finanzen und Personal bleiben in gesteuertem Nachweiswarten offen, ohne automatische Wiederaufnahme. P2-GOUV wird nach Ausnahmen bearbeitet; die bestätigte Reihenfolge lautet Aktivität + Reporting, Programm + Verantwortlichkeiten, danach Verwaltung + KPI [S11]. Der manuelle Vertrag des ersten Blocks ist vorbereitet, aber noch nicht bestätigt [S12].", "EN": "The M3S-GLOBAL-VUE-001 V0.2 cockpit lists 20 workstreams: 2 ACTIVE, 9 WAITING, 2 DEFERRED, 7 CLOSED and 0 BLOCKED [S10]. The 22 Villa LR1, LEGAL, Finance and HR actions remain open in governed evidence waiting, with no automatic restart. P2-GOUV resumes by exception; its confirmed order is Activity + Reporting, Programme + Responsibilities, then Administration + KPI [S11]. The manual contract for the first block is prepared but still awaiting confirmation [S12]."}}]}, {"id": "strategy", "title": {"FR": "Stratégie & cadre", "DE": "Strategie & Rahmen", "EN": "Strategy & framework"}, "intro": {"FR": "Du pourquoi aux responsabilités", "DE": "Vom Zweck zur Verantwortung", "EN": "From purpose to accountability"}, "blocks": [{"type": "table", "title": {"FR": "Quatre DAS : où agir", "DE": "Vier strategische Felder", "EN": "Four strategic domains"}, "heads": {"FR": ["DAS", "Finalité"], "DE": ["Feld", "Zweck"], "EN": ["Domain", "Purpose"]}, "rows": [[{"FR": "Social", "DE": "Soziales", "EN": "Social"}, {"FR": "Solidarité, inclusion, formation et accompagnement.", "DE": "Solidarität, Inklusion, Bildung und Begleitung.", "EN": "Solidarity, inclusion, training and support."}], [{"FR": "Business", "DE": "Business", "EN": "Business"}, {"FR": "Revenus, commerce, services et actifs économiques.", "DE": "Einnahmen, Handel, Dienstleistungen und wirtschaftliche Vermögenswerte.", "EN": "Revenue, commerce, services and economic assets."}], [{"FR": "Digital", "DE": "Digital", "EN": "Digital"}, {"FR": "M3S, applications, automatisation, IA et offres numériques.", "DE": "M3S, Anwendungen, Automatisierung, KI und digitale Angebote.", "EN": "M3S, applications, automation, AI and digital offers."}], [{"FR": "Gouvernance & Organisation", "DE": "Governance & Organisation", "EN": "Governance & Organisation"}, {"FR": "Cadre, coordination, conformité et maîtrise.", "DE": "Rahmen, Koordination, Compliance und Steuerung.", "EN": "Framework, coordination, compliance and oversight."}]]}, {"type": "prose", "title": {"FR": "DAS, offres et fonctions", "DE": "Felder, Angebote und Funktionen", "EN": "Domains, offers and functions"}, "body": {"FR": "Les DAS constituent des axes stratégiques transversaux dans S1. Ils ne remplacent ni les fonctions ni les menus. L’offre S2 décrit notamment organisation intelligente, automatisation métier, IA souveraine, formation IA, social business et e-commerce. Ce sont des axes et packs décrits, sans preuve ici que chaque offre soit commercialisée. FluxConvert, Courrier et GED peuvent alimenter de futures offres ; LocalPilotSummary est indiqué non branché. Les anciennes BU restent des références historiques.", "DE": "Die Felder sind in S1 strategische Querschnittsachsen. Sie ersetzen weder Funktionen noch Menüs. S2 beschreibt intelligente Organisation, Prozessautomatisierung, souveräne KI, KI-Schulung, Social Business und E-Commerce. Die beschriebenen Pakete sind hier nicht als vollständig vermarktet nachgewiesen. FluxConvert, Korrespondenz und Dokumentenmanagement können künftige Angebote unterstützen; LocalPilotSummary ist als nicht angebunden bezeichnet. Frühere Business Units bleiben historische Referenzen.", "EN": "S1 uses these domains as cross-cutting strategic axes. They do not replace functions or menus. S2 describes intelligent organisation, business automation, sovereign AI, AI training, social business and e-commerce. These are documented offers and packages, without evidence here that every offer is being sold. FluxConvert, Correspondence and document management may support future offers; LocalPilotSummary is described as unconnected. Former business units remain historical references."}}, {"type": "prose", "title": {"FR": "Qui décide ?", "DE": "Wer entscheidet?", "EN": "Who decides?"}, "body": {"FR": "Lecture institutionnelle de S1 : l’Assemblée Générale et le Bureau portent la gouvernance. Les mandats et pouvoirs exacts se vérifient dans les statuts, PV et décisions applicables. Un rôle logiciel ou un assistant IA ne constitue pas un mandat juridique. 2SG définit les priorités et valide les décisions ; Codex intervient comme opérateur technique dans le périmètre confié. Les responsables nominatifs des abonnements, sauvegardes, données et recettes restent à renseigner.", "DE": "Institutionelle Lesart von S1: Generalversammlung und Vorstand tragen die Governance. Genaue Mandate und Befugnisse sind anhand der geltenden Statuten, Protokolle und Beschlüsse zu prüfen. Eine Software-Rolle oder ein KI-Assistent ist kein rechtliches Mandat. 2SG setzt Prioritäten und validiert Entscheidungen; Codex arbeitet technisch im beauftragten Umfang. Namentliche Zuständigkeiten für Abonnements, Sicherungen, Daten und Abnahmen sind noch einzutragen.", "EN": "S1 places governance with the General Assembly and Board. Exact mandates and powers must be checked against applicable statutes, minutes and decisions. A software role or AI assistant is not a legal mandate. 2SG sets priorities and validates decisions; Codex operates technically within the assigned scope. Named owners for subscriptions, backups, data and acceptance checks remain to be recorded."}}, {"type": "prose", "title": {"FR": "La chaîne documentaire", "DE": "Die Dokumentationskette", "EN": "The document chain"}, "body": {"FR": "Documents directeurs → audit et synthèse → référentiel fonctionnel et opérationnel → exigences ERP → code et tests → usage et preuves. S3 prévoit dix ensembles : ouvrir en premier ; fondamentaux ; document directeur ; business model/plans ; LEGAL ; technique/IA ; audit/refondation ; offre/branding ; traductions ; archives. Il s’agit d’une arborescence cible, pas d’un inventaire de dossiers tous existants. Une boussole unique relie ces sources sans remplacer leur autorité.", "DE": "Leitdokumente → Audit und Synthese → funktionales und operatives Referenzmodell → ERP-Anforderungen → Code und Tests → Nutzung und Nachweise. S3 plant zehn Bereiche: Einstieg; Grundlagen; Leitdokument; Geschäftsmodell/Pläne; Recht; Technik/KI; Audit/Neuausrichtung; Angebot/Marke; Übersetzungen; Archiv. Dies ist eine Zielstruktur, kein Nachweis vollständig vorhandener Ordner. Ein gemeinsamer Kompass verbindet die Quellen, ohne ihre Autorität zu ersetzen.", "EN": "Governing documents → audit and synthesis → functional and operational reference model → ERP requirements → code and tests → usage and evidence. S3 proposes ten areas: start here; foundations; master document; business model/plans; legal; technology/AI; audit/restructuring; offer/branding; translations; archives. This is a target structure, not proof that all folders exist. One compass links the sources without replacing their authority."}}]}, {"id": "functions", "title": {"FR": "Fonctions & menus", "DE": "Funktionen & Menüs", "EN": "Functions & menus"}, "intro": {"FR": "L’organisation et son accès dans M3S", "DE": "Organisation und Zugang in M3S", "EN": "The organisation and its M3S entry points"}, "blocks": [{"type": "prose", "title": {"FR": "Convention de lecture", "DE": "Lesekonvention", "EN": "Reading convention"}, "body": {"FR": "Famille de fonctions = regroupement ; fonction = responsabilité métier durable ; processus = enchaînement d’activités ; module = composante logicielle ; menu = accès à des écrans. La famille « Management & Gouvernance » peut être retenue comme lecture pédagogique ; dans le code, ce nom désigne actuellement un groupe de navigation contenant le Tableau de Bord. Le Tableau de Bord est un outil de pilotage. La correspondance organisationnelle doit être validée dans le référentiel.", "DE": "Funktionsfamilie = Gruppierung; Funktion = dauerhafte fachliche Verantwortung; Prozess = Folge von Aktivitäten; Modul = Softwarebestandteil; Menü = Zugang zu Ansichten. „Management & Governance“ kann als didaktische Funktionsfamilie dienen; im Code bezeichnet es derzeit eine Navigationsgruppe mit dem Dashboard. Das Dashboard ist ein Steuerungsinstrument. Die organisatorische Zuordnung ist im Referenzmodell zu validieren.", "EN": "Function family = grouping; function = enduring business responsibility; process = sequence of activities; module = software component; menu = entry point to screens. “Management & Governance” can serve as a teaching category; in the code it currently names a navigation group containing the Dashboard. The Dashboard is a steering tool. Organisational mappings require validation in the reference model."}}, {"type": "prose", "title": {"FR": "Menu exact du code consulté", "DE": "Exaktes Menü des geprüften Codes", "EN": "Exact menu in the inspected code"}, "body": {"FR": "La carte ci-dessous reprend les groupes, libellés, sous-menus et chemins de menuStructure.json au commit e2141df74a38 (S6). Elle corrige le schéma simplifié précédent. Présence dans le code ≠ fonction disponible pour tous : permissions, déploiement et activation peuvent limiter l’accès. Le Journal d’audit requiert explicitement administration:audit:read. Les chemins sont des repères ; cette boussole n’exécute pas les fonctions de l’ERP.", "DE": "Die folgende Karte übernimmt Gruppen, Bezeichnungen, Untermenüs und Pfade aus menuStructure.json, Commit e2141df74a38 (S6). Sie korrigiert die frühere vereinfachte Darstellung. Im Code vorhanden bedeutet nicht für alle verfügbar: Rechte, Bereitstellung und Aktivierung können den Zugang begrenzen. Das Auditprotokoll verlangt ausdrücklich administration:audit:read. Die Pfade dienen der Orientierung; dieser Kompass führt keine ERP-Funktionen aus.", "EN": "The map below reproduces groups, labels, submenus and paths from menuStructure.json at commit e2141df74a38 (S6), correcting the previous simplified diagram. Present in code does not mean available to everyone: permissions, deployment and activation may restrict access. The audit log explicitly requires administration:audit:read. Paths are reference points; this compass does not execute ERP functions."}}, {"type": "menu"}]}, {"id": "system", "title": {"FR": "Système technique", "DE": "Technisches System", "EN": "Technical system"}, "intro": {"FR": "Qui fait quoi dans la chaîne ?", "DE": "Wer übernimmt welche Aufgabe?", "EN": "Who does what in the chain?"}, "blocks": [{"type": "prose", "title": {"FR": "Deux circuits complémentaires", "DE": "Zwei ergänzende Abläufe", "EN": "Two complementary flows"}, "body": {"FR": "Le circuit d’utilisation relie le navigateur à l’interface, puis à l’API et aux données. Le circuit de fabrication relie le travail de développement à GitHub, aux tests et aux hébergeurs. Les e-mails ont leur propre circuit chez Hostpoint : ils ne passent pas nécessairement par l’interface Netlify. La carte décrit les relations ; elle ne surveille pas les services en temps réel.", "DE": "Der Nutzungsablauf verbindet Browser, Oberfläche, API und Daten. Der Entwicklungsablauf verbindet Entwicklungsarbeit, GitHub, Tests und Hosting. E-Mails haben einen eigenen Ablauf bei Hostpoint und laufen nicht zwingend über Netlify. Die Karte beschreibt Beziehungen; sie überwacht keine Dienste in Echtzeit.", "EN": "The usage flow links browser, interface, API and data. The delivery flow links development work, GitHub, tests and hosting. Email has its own flow at Hostpoint and does not necessarily pass through Netlify. The map describes relationships; it does not monitor services live."}}, {"type": "systemmap"}, {"type": "table", "title": {"FR": "Inventaire des composants et fournisseurs", "DE": "Komponenten und Anbieter", "EN": "Components and providers"}, "heads": {"FR": ["Composant / fournisseur", "Rôle simple", "État et preuve"], "DE": ["Komponente / Anbieter", "Einfache Erklärung", "Stand und Nachweis"], "EN": ["Component / provider", "Plain-language role", "State and evidence"]}, "rows": [[{"FR": "Domaine · Hostpoint", "DE": "Domain · Hostpoint", "EN": "Domain · Hostpoint"}, {"FR": "seneswiss-group.com : adresse Internet, présente dans le compte.", "DE": "seneswiss-group.com: Internetadresse, im Konto vorhanden.", "EN": "seneswiss-group.com: Internet address present in the account."}, {"FR": "Compte consulté [S7]. Contrat et renouvellement à documenter.", "DE": "Konto geprüft [S7]. Vertrag und Verlängerung zu dokumentieren.", "EN": "Account inspected [S7]. Contract and renewal to document."}], [{"FR": "DNS · NS1 / référence Netlify", "DE": "DNS · NS1 / Netlify-Verweis", "EN": "DNS · NS1 / Netlify reference"}, {"FR": "Annuaire qui oriente le trafic du domaine vers les services.", "DE": "Verzeichnis, das Domainverkehr zu Diensten leitet.", "EN": "Directory routing domain traffic to services."}, {"FR": "NS publics nsone.net ; SOA mentionnant Netlify [S8]. Gestion effective à confirmer.", "DE": "Öffentliche NS: nsone.net; SOA nennt Netlify [S8]. Verwaltung zu bestätigen.", "EN": "Public NS: nsone.net; SOA mentions Netlify [S8]. Effective administration to confirm."}], [{"FR": "Mail · Hostpoint Cloud Office", "DE": "Mail · Hostpoint Cloud Office", "EN": "Mail · Hostpoint Cloud Office"}, {"FR": "Héberge les boîtes professionnelles ; distinct de la connexion M3S.", "DE": "Betreibt geschäftliche Postfächer; getrennt von der M3S-Anmeldung.", "EN": "Hosts business mailboxes; separate from M3S sign-in."}, {"FR": "4 comptes vus ; fonctionnement de la boîte de Cheikh confirmé par lui [S7,S9].", "DE": "4 Konten gesehen; Cheikh bestätigt die Funktion seines Postfachs [S7,S9].", "EN": "4 accounts observed; Cheikh confirms his mailbox works [S7,S9]."}], [{"FR": "Web · Hostpoint Smart Webhosting", "DE": "Web · Hostpoint Smart Webhosting", "EN": "Web · Hostpoint Smart Webhosting"}, {"FR": "Espace web sur sl1797.web.hostpoint.ch ; site edegupaw.myhostpoint.ch avec Apache/PHP.", "DE": "Webspace auf sl1797.web.hostpoint.ch; Website edegupaw.myhostpoint.ch mit Apache/PHP.", "EN": "Web space on sl1797.web.hostpoint.ch; edegupaw.myhostpoint.ch website with Apache/PHP."}, {"FR": "Hébergement et site configurés, vérifiés [S7]. Contenu et usage actuel du site non audités.", "DE": "Hosting und Website-Konfiguration geprüft [S7]. Inhalt und aktuelle Nutzung nicht auditiert.", "EN": "Hosting and website configuration verified [S7]. Content and current website usage not audited."}], [{"FR": "Interface · React / Netlify", "DE": "Oberfläche · React / Netlify", "EN": "Interface · React / Netlify"}, {"FR": "React construit les écrans ; Netlify publie et sert leur version web.", "DE": "React erstellt Ansichten; Netlify veröffentlicht und liefert sie aus.", "EN": "React builds screens; Netlify publishes and serves the web version."}, {"FR": "Réponse HTTP 200 avec server: Netlify pour le domaine [S8]. Recette complète non effectuée.", "DE": "HTTP 200 mit server: Netlify für die Domain [S8]. Keine vollständige Abnahme.", "EN": "HTTP 200 with server: Netlify for the domain [S8]. No full acceptance test."}], [{"FR": "Serveur · Node.js / Express / Railway", "DE": "Server · Node.js / Express / Railway", "EN": "Server · Node.js / Express / Railway"}, {"FR": "Reçoit les demandes, applique les règles et dialogue avec les données.", "DE": "Empfängt Anfragen, wendet Regeln an und greift auf Daten zu.", "EN": "Receives requests, applies rules and communicates with data."}, {"FR": "Architecture active documentée dans S1 ; état live non recontrôlé ici.", "DE": "Aktive Architektur in S1 dokumentiert; Livezustand hier nicht erneut geprüft.", "EN": "Active architecture documented in S1; live state not rechecked here."}], [{"FR": "Données · BigQuery / Google Cloud", "DE": "Daten · BigQuery / Google Cloud", "EN": "Data · BigQuery / Google Cloud"}, {"FR": "Entrepôt de données historique et analytique.", "DE": "Historischer und analytischer Datenspeicher.", "EN": "Historical and analytical data warehouse."}, {"FR": "Socle actif documenté [S1] ; aucune migration générale démontrée.", "DE": "Aktive Basis dokumentiert [S1]; keine allgemeine Migration nachgewiesen.", "EN": "Documented active foundation [S1]; no general migration demonstrated."}], [{"FR": "Base · Hostpoint MariaDB", "DE": "Datenbank · Hostpoint MariaDB", "EN": "Database · Hostpoint MariaDB"}, {"FR": "Le panneau indique une base et un serveur MariaDB 10.11.", "DE": "Das Panel zeigt eine Datenbank und MariaDB 10.11.", "EN": "The panel shows one database and MariaDB 10.11."}, {"FR": "Existence vérifiée [S7] ; contenu et liaison M3S non établis.", "DE": "Existenz geprüft [S7]; Inhalt und M3S-Anbindung ungeklärt.", "EN": "Existence verified [S7]; content and M3S connection unestablished."}], [{"FR": "Code · GitHub", "DE": "Code · GitHub", "EN": "Code · GitHub"}, {"FR": "Mémoire du code : versions, branches, revues et historique.", "DE": "Code-Gedächtnis: Versionen, Branches, Reviews und Verlauf.", "EN": "Code memory: versions, branches, reviews and history."}, {"FR": "Frontend inspecté [S6]. Dépôts backend et cockpit identifiés [S1].", "DE": "Frontend geprüft [S6]. Backend- und Cockpit-Repositories identifiziert [S1].", "EN": "Frontend inspected [S6]. Backend and cockpit repositories identified [S1]."}], [{"FR": "PostgreSQL / PGlite / Supabase", "DE": "PostgreSQL / PGlite / Supabase", "EN": "PostgreSQL / PGlite / Supabase"}, {"FR": "PostgreSQL est la technologie relationnelle candidate ; PGlite a servi aux preuves synthétiques en mémoire ; Supabase a servi uniquement à des essais éphémères bornés.", "DE": "PostgreSQL ist die relationale Kandidatentechnologie; PGlite diente synthetischen In-Memory-Nachweisen; Supabase wurde nur für begrenzte temporäre Tests verwendet.", "EN": "PostgreSQL is the candidate relational technology; PGlite supported synthetic in-memory proofs; Supabase was used only for bounded ephemeral trials."}, {"FR": "Deux essais E4 Supabase ont abouti à NO-GO puis nettoyage complet. Paiement de 27,03 USD déclaré ; aucun remboursement ou crédit confirmé. Aucun fournisseur PostgreSQL de production, stockage réel ou activation n’est retenu.", "DE": "Zwei Supabase-E4-Tests endeten mit NO-GO und vollständiger Bereinigung. Zahlung von 27,03 USD gemeldet; keine Rückerstattung oder Gutschrift bestätigt. Kein PostgreSQL-Produktivanbieter, realer Speicher oder Aktivierung ausgewählt.", "EN": "Two Supabase E4 trials ended NO-GO and were fully cleaned up. A USD 27.03 payment is reported; no refund or account credit is confirmed. No production PostgreSQL provider, real storage or activation has been selected."}], [{"FR": "Opérateurs · 2SG, Codex, assistants", "DE": "Akteure · 2SG, Codex, Assistenten", "EN": "Operators · 2SG, Codex, assistants"}, {"FR": "2SG décide ; Codex aide à réaliser et vérifier ; les assistants soutiennent les tâches.", "DE": "2SG entscheidet; Codex unterstützt Umsetzung und Prüfung; Assistenten helfen bei Aufgaben.", "EN": "2SG decides; Codex helps implement and verify; assistants support tasks."}, {"FR": "Rôles décrits [S1,S4]. Aucun opérateur ne remplace la responsabilité humaine.", "DE": "Rollen beschrieben [S1,S4]. Menschliche Verantwortung bleibt bestehen.", "EN": "Roles described [S1,S4]. Human accountability remains in place."}]]}, {"type": "prose", "title": {"FR": "L’écart DNS / mail", "DE": "Die DNS-/Mail-Abweichung", "EN": "The DNS/email discrepancy"}, "body": {"FR": "Une requête publique MX n’a retourné aucune destination, alors que les boîtes sont présentes et que Cheikh confirme un usage fonctionnel de longue date. Ce résultat isolé reste inexpliqué : aucune panne n’est établie et aucun réglage n’a été changé. Le fonctionnement déclaré concerne sa boîte ; il ne constitue pas un test des quatre comptes.", "DE": "Eine öffentliche MX-Abfrage lieferte kein Ziel, obwohl Postfächer vorhanden sind und Cheikh den langjährigen Betrieb bestätigt. Das isolierte Ergebnis bleibt ungeklärt: Es ist kein Ausfall festgestellt und keine Einstellung geändert worden. Die Nutzungsbestätigung betrifft sein Postfach und ist kein Test aller vier Konten.", "EN": "A public MX query returned no destination, while mailboxes exist and Cheikh confirms long-standing working usage. This isolated result remains unexplained: no outage is established and no settings were changed. His confirmation concerns his mailbox; it is not a test of all four accounts."}}, {"type": "table", "title": {"FR": "Sécurité : trois questions distinctes", "DE": "Sicherheit: drei getrennte Fragen", "EN": "Security: three separate questions"}, "heads": {"FR": ["Question", "Mécanisme", "Limite"], "DE": ["Frage", "Mechanismus", "Grenze"], "EN": ["Question", "Mechanism", "Limit"]}, "rows": [[{"FR": "Qui êtes-vous ?", "DE": "Wer sind Sie?", "EN": "Who are you?"}, {"FR": "Authentification : identité et jeton de session / API.", "DE": "Authentifizierung: Identität und Sitzungs-/API-Token.", "EN": "Authentication: identity and session/API token."}, {"FR": "S1 décrit des jetons Bearer ; ce n’est pas une preuve d’authentification Supabase.", "DE": "S1 beschreibt Bearer-Token; kein Nachweis für Supabase Auth.", "EN": "S1 describes Bearer tokens; this is not evidence of Supabase Auth."}], [{"FR": "Que pouvez-vous faire ?", "DE": "Was dürfen Sie tun?", "EN": "What may you do?"}, {"FR": "Autorisations : permissions selon rôles et opérations.", "DE": "Autorisierung: Rechte nach Rollen und Vorgängen.", "EN": "Authorisation: permissions by role and operation."}, {"FR": "Un accès logiciel ne confère pas un mandat institutionnel.", "DE": "Softwarezugang verleiht kein institutionelles Mandat.", "EN": "Software access does not grant an institutional mandate."}], [{"FR": "Que faut-il protéger ?", "DE": "Was ist zu schützen?", "EN": "What needs protection?"}, {"FR": "Secrets hors code ; données sensibles à accès limité ; sauvegarde et restauration.", "DE": "Geheimnisse außerhalb des Codes; beschränkter Datenzugang; Sicherung und Wiederherstellung.", "EN": "Secrets outside code; restricted sensitive data; backup and recovery."}, {"FR": "Politique documentée ≠ restauration testée. Responsables et preuves à compléter.", "DE": "Dokumentierte Richtlinie ≠ getestete Wiederherstellung. Zuständigkeiten und Nachweise ergänzen.", "EN": "Documented policy ≠ tested recovery. Owners and evidence need completion."}]]}, {"type": "prose", "title": {"FR": "Les outils de fabrication", "DE": "Entwicklungswerkzeuge", "EN": "Development tools"}, "body": {"FR": "S1 décrit React 19, React Router 7, Axios, Recharts, Tailwind CSS 4, Express 4, le client BigQuery et des scripts Node/Python. Ces versions sont des références documentaires, pas une mesure des versions exécutées aujourd’hui. SQL sert à interroger les données ; JSON sert à échanger des informations ; Markdown porte la documentation. Git versionne les changements et GitHub héberge les dépôts.", "DE": "S1 nennt React 19, React Router 7, Axios, Recharts, Tailwind CSS 4, Express 4, den BigQuery-Client sowie Node-/Python-Skripte. Dies sind dokumentierte Referenzen, keine Messung aktuell ausgeführter Versionen. SQL fragt Daten ab, JSON überträgt Informationen, Markdown trägt Dokumentation. Git versioniert Änderungen und GitHub hostet Repositories.", "EN": "S1 describes React 19, React Router 7, Axios, Recharts, Tailwind CSS 4, Express 4, the BigQuery client and Node/Python scripts. These versions are documentary references, not measurements of the versions running today. SQL queries data; JSON exchanges information; Markdown carries documentation. Git versions changes and GitHub hosts repositories."}}]}, {"id": "status", "title": {"FR": "État des chantiers", "DE": "Stand der Vorhaben", "EN": "Workstream status"}, "intro": {"FR": "Les acquis, les limites et la suite", "DE": "Erreichtes, Grenzen und nächste Schritte", "EN": "Progress, boundaries and next steps"}, "blocks": [{"type": "prose", "title": {"FR": "Comment lire les statuts", "DE": "So lesen Sie den Status", "EN": "How to read status"}, "body": {"FR": "Vérifié : observation directe identifiée. Confirmé par l’utilisateur : usage déclaré. Documenté : état rapporté dans une source, sans nouveau test ici. À consolider : réalisation partielle. Cible : orientation ou expérimentation. Non activé : frontière explicitement maintenue. La matrice suivante reprend S1 ; elle ne remplace pas une recette actuelle des modules.", "DE": "Geprüft: benannte direkte Beobachtung. Vom Nutzer bestätigt: berichtete Nutzung. Dokumentiert: Quellenangabe ohne erneuten Test hier. Zu konsolidieren: teilweise umgesetzt. Zielbild: Orientierung oder Experiment. Nicht aktiviert: ausdrücklich beibehaltene Grenze. Die folgende Matrix übernimmt S1 und ersetzt keine aktuelle Modulabnahme.", "EN": "Verified: identified direct observation. User-confirmed: reported usage. Documented: source-reported state without retesting here. To consolidate: partial implementation. Target: direction or experiment. Not activated: explicit boundary retained. The following matrix reflects S1 and does not replace current module acceptance testing."}}, {"type": "table", "title": {"FR": "Photographie documentaire [S1]", "DE": "Dokumentierter Stand [S1]", "EN": "Documentary snapshot [S1]"}, "heads": {"FR": ["Chantier", "Acquis rapporté", "Suite / limite"], "DE": ["Vorhaben", "Berichteter Fortschritt", "Nächster Schritt / Grenze"], "EN": ["Workstream", "Reported progress", "Next step / boundary"]}, "rows": [[{"FR": "Stratégie / LEGAL", "DE": "Strategie / Recht", "EN": "Strategy / legal"}, {"FR": "Audit, synthèse et référentiels avancés.", "DE": "Audit, Synthese und Refere "EN": "Architecture and bounded trials described."}, {"FR": "Aucune autonomie ou commercialisation générale prouvée.", "DE": "Keine allgemeine Autonomie oder Vermarktung nachgewiesen.", "EN": "No general autonomy or commercialisation proven."}]]}, {"type": "table", "title": {"FR": "Cockpit global V0.2 [S10-S12]", "DE": "Globales Cockpit V0.2 [S10-S12]", "EN": "Global cockpit V0.2 [S10-S12]"}, "heads": {"FR": ["File", "État actuel", "Règle de reprise"], "DE": ["Liste", "Aktueller Stand", "Wiederaufnahmeregel"], "EN": ["Queue", "Current state", "Resume rule"]}, "rows": [[{"FR": "Vue globale", "DE": "Gesamtansicht", "EN": "Global view"}, {"FR": "20 chantiers : 2 ACTIF, 9 ATTENTE, 2 DIFFÉRÉ, 7 FERMÉ, 0 BLOQUÉ.", "DE": "20 Vorhaben: 2 AKTIV, 9 WARTEND, 2 ZURÜCKGESTELLT, 7 GESCHLOSSEN, 0 BLOCKIERT.", "EN": "20 workstreams: 2 ACTIVE, 9 WAITING, 2 DEFERRED, 7 CLOSED, 0 BLOCKED."}, {"FR": "Réviser lors d’une décision, preuve ou évolution majeure.", "DE": "Bei Entscheidung, Nachweis oder wesentlicher Änderung aktualisieren.", "EN": "Update after a decision, evidence item or major change."}], [{"FR": "P1-REEL", "DE": "P1-REAL", "EN": "P1-REAL"}, {"FR": "Villa LR1, LEGAL, Finances et RH : 22 actions ouvertes en attente probatoire gouvernée.", "DE": "Villa LR1, Recht, Finanzen und Personal: 22 offene Maßnahmen im gesteuerten Nachweiswarten.", "EN": "Villa LR1, LEGAL, Finance and HR: 22 open actions in governed evidence waiting."}, {"FR": "Uniquement sur information humaine nouvelle ou preuve précisément autorisée.", "DE": "Nur bei neuer menschlicher Information oder ausdrücklich autorisiertem Nachweis.", "EN": "Only on new human information or specifically authorised evidence."}], [{"FR": "P2-GOUV", "DE": "P2-GOV", "EN": "P2-GOV"}, {"FR": "Arbitrage confirmé ; Bloc A Activité + Reporting préparé, non encore confirmé.", "DE": "Arbitrage bestätigt; Block A Aktivität + Reporting vorbereitet, noch nicht bestätigt.", "EN": "Arbitration confirmed; Block A Activity + Reporting prepared, not yet confirmed."}, {"FR": "Confirmation groupée des huit arbitrages du Bloc A.", "DE": "Gebündelte Bestätigung der acht Entscheidungen von Block A.", "EN": "Grouped confirmation of the eight Block A decisions."}], [{"FR": "P3-TECH / P4-RESERVE", "DE": "P3-TECH / P4-RESERVE", "EN": "P3-TECH / P4-RESERVE"}, {"FR": "Maintien silencieux pendant la reprise P2-GOUV.", "DE": "Stiller Bestand während der P2-GOUV-Wiederaufnahme.", "EN": "Held quietly while P2-GOUV resumes."}, {"FR": "Ne pas ouvrir sans décision distincte.", "DE": "Nicht ohne separate Entscheidung öffnen.", "EN": "Do not open without a separate decision."}]]}, {"type": "prose", "title": {"FR": "Architecture IA cible [S4]", "DE": "KI-Zielarchitektur [S4]", "EN": "Target AI architecture [S4]"}, "body": {"FR": "Strategic Brain coordonne les agents spécialisés : Veille/Knowledge, Finance/FX, Data/Reporting, CRM/Relations, PMO/Projets, Développement/Automatisation ; Commerce et Offre digitale sont des extensions futures. Le flux décrit est Scout → Analyst → Creator → Editor → Publisher. « Publisher » prépare la diffusion ; une validation humaine précède la publication. Le document décrit une phase d’implémentation envisagée, sans prouver que tous les agents tournent.", "DE": "Strategic Brain koordiniert spezialisierte Agenten: Monitoring/Wissen, Finanzen/FX, Daten/Reporting, CRM/Beziehungen, PMO/Projekte, Entwicklung/Automatisierung; Handel und digitale Angebote sind spätere Erweiterungen. Der Ablauf lautet Scout → Analyst → Creator → Editor → Publisher. Publisher bereitet die Verteilung vor; menschliche Freigabe geht der Veröffentlichung voraus. Das Dokument beschreibt eine geplante Implementierungsphase, keinen Nachweis, dass alle Agenten laufen.", "EN": "Strategic Brain coordinates specialised agents: Intelligence/Knowledge, Finance/FX, Data/Reporting, CRM/Relations, PMO/Projects, Development/Automation; Commerce and Digital Offers are future extensions. The flow is Scout → Analyst → Creator → Editor → Publisher. Publisher prepares distribution; human validation precedes publication. The document describes a planned implementation phase, not proof that all agents are running."}}]}, {"id": "evolution", "title": {"FR": "Évolution", "DE": "Entwicklung", "EN": "Evolution"}, "intro": {"FR": "Comprendre le chemin parcouru", "DE": "Den bisherigen Weg verstehen", "EN": "Understand the journey so far"}, "blocks": [{"type": "table", "title": {"FR": "Repères datés", "DE": "Datierte Meilensteine", "EN": "Dated milestones"}, "heads": {"FR": ["Date", "Évolution", "Qualification"], "DE": ["Datum", "Entwicklung", "Einordnung"], "EN": ["Date", "Change", "Qualification"]}, "rows": [[{"FR": "17.05.2026", "DE": "17.05.2026", "EN": "2026-05-17"}, {"FR": "Architecture des agents fusionnée.", "DE": "Zusammengeführte Agentenarchitektur.", "EN": "Merged agent architecture."}, {"FR": "Cible de phase 2 [S4].", "DE": "Zielbild Phase 2 [S4].", "EN": "Phase 2 target [S4]."}], [{"FR": "04.06.2026", "DE": "04.06.2026", "EN": "2026-06-04"}, {"FR": "Inventaire et architecture visuelle initiaux.", "DE": "Erstes Inventar und visuelle Architektur.", "EN": "Initial inventory and visual architecture."}, {"FR": "Historique : volumes et « complet » non repris comme faits actuels [S5].", "DE": "Historisch: Mengen und „vollständig“ nicht als aktuell übernommen [S5].", "EN": "Historical: counts and “complete” claims not reused as current facts [S5]."}], [{"FR": "22.06.2026", "DE": "22.06.2026", "EN": "2026-06-22"}, {"FR": "Architecture des documents directeurs transmise.", "DE": "Struktur der Leitdokumente übermittelt.", "EN": "Governing document architecture supplied."}, {"FR": "Arborescence cible [S3].", "DE": "Zielstruktur [S3].", "EN": "Target structure [S3]."}], [{"FR": "13.09.2026 · V2.2", "DE": "13.09.2026 · V2.2", "EN": "2026-09-13 · V2.2"}, {"FR": "Boussole globale : stratégie, opérations, technique et maturité.", "DE": "Globaler Kompass: Strategie, Betrieb, Technik und Reife.", "EN": "Global compass: strategy, operations, technology and maturity."}, {"FR": "Synthèse documentaire précédente [S1].", "DE": "Vorherige Dokumentationssynthese [S1].", "EN": "Previous documentary synthesis [S1]."}], [{"FR": "13.09.2026 · V3.0", "DE": "13.09.2026 · V3.0", "EN": "2026-09-13 · V3.0"}, {"FR": "Hostpoint réintégré ; menu exact ; termes clarifiés ; support autonome trilingue.", "DE": "Hostpoint ergänzt; exaktes Menü; Begriffe geklärt; dreisprachige Offlineansicht.", "EN": "Hostpoint restored; exact menu; clarified terms; trilingual standalone view."}, {"FR": "Nouvelle édition de la même boussole.", "DE": "Neue Ausgabe desselben Kompasses.", "EN": "New edition of the same compass."}], [{"FR": "13.09.2026 · V3.1", "DE": "13.09.2026 · V3.1", "EN": "2026-09-13 · V3.1"}, {"FR": "Cockpit V0.2, files de reprise, parcours technique et état Supabase intégrés.", "DE": "Cockpit V0.2, Wiederaufnahmelisten, technischer Ablauf und Supabase-Stand ergänzt.", "EN": "Cockpit V0.2, resume queues, technical journey and Supabase state added."}, {"FR": "Révision contrôlée de la source V3.0, sans modification de M3S.", "DE": "Kontrollierte Revision der V3.0-Quelle ohne Änderung an M3S.", "EN": "Controlled revision of the V3.0 source, with no M3S change."}]]}, {"type": "prose", "title": {"FR": "Du développement au service en ligne", "DE": "Von der Entwicklung zum Livebetrieb", "EN": "From development to live service"}, "body": {"FR": "Développement : construire ou corriger. Test : contrôler un comportement. Preview/préproduction : examiner une version avant diffusion. Production informatique : version utilisée en situation réelle. Production métier : fabriquer un produit ou réaliser une prestation — autre sens du mot. Le parcours documenté est besoin → branche → code → tests → revue/PR → preview → décision humaine → fusion/déploiement → vérification d’usage → journal. Une fusion ne prouve pas une activation.", "DE": "Entwicklung: bauen oder korrigieren. Test: Verhalten prüfen. Preview/Vorproduktion: Version vor Veröffentlichung prüfen. IT-Produktivbetrieb: Version im realen Einsatz. Fachliche Produktion: Produkt herstellen oder Leistung erbringen — andere Bedeutung. Dokumentierter Ablauf: Bedarf → Branch → Code → Tests → Review/PR → Preview → menschliche Entscheidung → Zusammenführung/Bereitstellung → Nutzungsprüfung → Protokoll. Zusammenführung beweist keine Aktivierung.", "EN": "Development: build or fix. Testing: check behaviour. Preview/preproduction: inspect a version before release. IT production: version used in real operations. Business production: manufacture a product or deliver a service — a different meaning. Documented flow: need → branch → code → tests → review/PR → preview → human decision → merge/deploy → usage verification → journal. A merge does not prove activation."}}, {"type": "table", "title": {"FR": "Du besoin à l’usage réel", "DE": "Vom Bedarf zur realen Nutzung", "EN": "From need to real use"}, "heads": {"FR": ["Étape", "Question simple", "Résultat attendu"], "DE": ["Schritt", "Einfache Frage", "Erwartetes Ergebnis"], "EN": ["Stage", "Plain question", "Expected result"]}, "rows": [[{"FR": "1. Besoin", "DE": "1. Bedarf", "EN": "1. Need"}, {"FR": "Quel problème faut-il résoudre ?", "DE": "Welches Problem soll gelöst werden?", "EN": "What problem should be solved?"}, {"FR": "Besoin et résultat attendu clairement formulés.", "DE": "Klar formulierter Bedarf und erwartetes Ergebnis.", "EN": "A clearly stated need and expected outcome."}], [{"FR": "2. Cadrage", "DE": "2. Rahmen", "EN": "2. Framing"}, {"FR": "Que fait-on, que ne fait-on pas et qui décide ?", "DE": "Was tun wir, was nicht, und wer entscheidet?", "EN": "What is in, what is out, and who decides?"}, {"FR": "Périmètre, risques, responsable et critères de réussite.", "DE": "Umfang, Risiken, Verantwortung und Erfolgskriterien.", "EN": "Scope, risks, owner and success criteria."}], [{"FR": "3. Branche et code", "DE": "3. Branch und Code", "EN": "3. Branch and code"}, {"FR": "Comment construire sans déranger la version stable ?", "DE": "Wie bauen wir, ohne die stabile Version zu stören?", "EN": "How do we build without disturbing the stable version?"}, {"FR": "Changements isolés et traçables.", "DE": "Isolierte und nachvollziehbare Änderungen.", "EN": "Isolated, traceable changes."}], [{"FR": "4. Tests", "DE": "4. Tests", "EN": "4. Tests"}, {"FR": "Le comportement attendu est-il vérifié ?", "DE": "Ist das erwartete Verhalten geprüft?", "EN": "Is the expected behaviour verified?"}, {"FR": "Résultats reproductibles et écarts connus.", "DE": "Reproduzierbare Ergebnisse und bekannte Abweichungen.", "EN": "Reproducible results and known gaps."}], [{"FR": "5. PR et revue", "DE": "5. PR und Review", "EN": "5. PR and review"}, {"FR": "Le changement est-il relu avant fusion ?", "DE": "Wurde die Änderung vor dem Zusammenführen geprüft?", "EN": "Was the change reviewed before merge?"}, {"FR": "Verdict, corrections et décision humaine.", "DE": "Urteil, Korrekturen und menschliche Entscheidung.", "EN": "Verdict, corrections and human decision."}], [{"FR": "6. Preview", "DE": "6. Preview", "EN": "6. Preview"}, {"FR": "Peut-on l’essayer sans toucher à la production ?", "DE": "Kann es ohne Produktionsänderung geprüft werden?", "EN": "Can it be tried without touching production?"}, {"FR": "Recette visuelle et fonctionnelle isolée.", "DE": "Isolierte visuelle und funktionale Abnahme.", "EN": "Isolated visual and functional acceptance."}], [{"FR": "7. Fusion et déploiement", "DE": "7. Zusammenführung und Bereitstellung", "EN": "7. Merge and deployment"}, {"FR": "Le code retenu est-il publié sur le bon environnement ?", "DE": "Wird der gewählte Code in der richtigen Umgebung bereitgestellt?", "EN": "Is the selected code released to the right environment?"}, {"FR": "Version technique disponible ; pas encore forcément activée.", "DE": "Technische Version verfügbar; nicht zwingend aktiviert.", "EN": "Technical version available, not necessarily activated."}], [{"FR": "8. Activation et preuve", "DE": "8. Aktivierung und Nachweis", "EN": "8. Activation and evidence"}, {"FR": "L’usage réel est-il autorisé, accessible et contrôlé ?", "DE": "Ist die reale Nutzung autorisiert, zugänglich und kontrolliert?", "EN": "Is real use authorised, accessible and controlled?"}, {"FR": "Recette, décision d’activation, preuves datées et journal.", "DE": "Abnahme, Aktivierungsentscheidung, datierte Nachweise und Protokoll.", "EN": "Acceptance, activation decision, dated evidence and journal."}]]}, {"type": "prose", "title": {"FR": "Prochaines étapes proposées", "DE": "Vorgeschlagene nächste Schritte", "EN": "Proposed next steps"}, "body": {"FR": "1. Relire cette boussole et valider les correspondances métier. 2. Compléter les responsables, contrats, renouvellements, sauvegardes et l’usage de la base Hostpoint. 3. Réaliser une recette authentifiée par fonction avant de déclarer un domaine complet. 4. Consolider Document Directeur, offre et portefeuille global. 5. Décider séparément du fournisseur PostgreSQL et des activations Budget/banque. 6. Préparer l’intégration de la boussole dans M3S. Une révision après changement majeur est utile ; la cadence trimestrielle reste à convenir, sans automatisation créée.", "DE": "1. Diesen Kompass prüfen und fachliche Zuordnungen validieren. 2. Verantwortliche, Verträge, Verlängerungen, Sicherungen und Nutzung der Hostpoint-Datenbank ergänzen. 3. Authentifizierte Abnahme je Funktion vor einer Vollständigkeitserklärung. 4. Leitdokument, Angebot und Gesamtportfolio konsolidieren. 5. PostgreSQL-Anbieter und Budget-/Bankaktivierungen getrennt entscheiden. 6. Integration des Kompasses in M3S vorbereiten. Nach wesentlichen Änderungen aktualisieren; vierteljährlicher Rhythmus noch zu vereinbaren, keine Automation eingerichtet.", "EN": "1. Review this compass and validate business mappings. 2. Complete owners, contracts, renewals, backups and Hostpoint database usage. 3. Run authenticated acceptance checks by function before declaring a domain complete. 4. Consolidate the master document, offer and overall portfolio. 5. Decide separately on the PostgreSQL provider and budget/banking activation. 6. Prepare compass integration into M3S. Update after major changes; quarterly cadence remains to be agreed, with no automation created."}}]}, {"id": "glossary", "title": {"FR": "Glossaire", "DE": "Glossar", "EN": "Glossary"}, "intro": {"FR": "Les mots pour s’orienter", "DE": "Begriffe zur Orientierung", "EN": "Words that help you navigate"}, "blocks": [{"type": "prose", "title": {"FR": "Rôle de ces définitions", "DE": "Rolle dieser Definitionen", "EN": "Role of these definitions"}, "body": {"FR": "Ces formulations courtes servent à l’orientation d’un profil non technique. Elles ne remplacent pas le Glossaire central 2SG, qui reste la source maître. Toute nouvelle entrée ou modification durable doit passer par la file de validation terminologique GLO-TECH-01 avant publication.", "DE": "Diese Kurzdefinitionen dienen der Orientierung nichttechnischer Nutzer. Sie ersetzen nicht das zentrale 2SG-Glossar als maßgebliche Quelle. Jeder neue oder dauerhaft geänderte Begriff muss vor Veröffentlichung die Terminologie-Prüfliste GLO-TECH-01 durchlaufen.", "EN": "These short definitions help non-technical readers navigate. They do not replace the central 2SG Glossary, which remains the master source. Any new or lasting term change must pass through the GLO-TECH-01 terminology validation queue before publication."}}, {"type": "table", "title": {"FR": "Repères sans jargon", "DE": "Orientierung ohne Fachjargon", "EN": "Plain-language reference"}, "heads": {"FR": ["Terme", "Explication"], "DE": ["Begriff", "Erklärung"], "EN": ["Term", "Explanation"]}, "rows": [[{"FR": "ERP", "DE": "ERP", "EN": "ERP"}, {"FR": "Logiciel qui relie plusieurs activités de gestion de l’organisation.", "DE": "Software, die mehrere Managementaktivitäten verbindet.", "EN": "Software connecting several organisational management activities."}], [{"FR": "GED", "DE": "Dokumentenmanagement (GED)", "EN": "Document management (GED)"}, {"FR": "Classement, recherche, versions et droits des documents.", "DE": "Ablage, Suche, Versionen und Zugriffsrechte für Dokumente.", "EN": "Document filing, search, versions and access rights."}], [{"FR": "DAS", "DE": "Strategisches Geschäftsfeld (DAS)", "EN": "Strategic domain (DAS)"}, {"FR": "Axe de stratégie transversal, distinct d’une fonction et d’un menu.", "DE": "Strategische Querschnittsachse, getrennt von Funktion und Menü.", "EN": "Cross-cutting strategic axis, distinct from a function or menu."}], [{"FR": "Frontend / Backend", "DE": "Frontend / Backend", "EN": "Frontend / Backend"}, {"FR": "Écrans dans le navigateur / logique et traitement côté serveur.", "DE": "Browseransichten / Logik und Verarbeitung auf dem Server.", "EN": "Browser screens / server-side logic and processing."}], [{"FR": "API", "DE": "API", "EN": "API"}, {"FR": "Point de dialogue structuré entre logiciels.", "DE": "Strukturierte Schnittstelle zwischen Programmen.", "EN": "Structured communication interface between software systems."}], [{"FR": "Domaine / DNS / Hébergement", "DE": "Domain / DNS / Hosting", "EN": "Domain / DNS / Hosting"}, {"FR": "Adresse / annuaire d’orientation / espace qui sert ou exécute le site.", "DE": "Adresse / Wegweiser / Speicher- und Ausführungsort der Website.", "EN": "Address / routing directory / space that serves or runs a website."}], [{"FR": "Auth / Permissions", "DE": "Auth / Berechtigungen", "EN": "Auth / permissions"}, {"FR": "Vérifier qui se connecte / déterminer ce qu’il peut faire.", "DE": "Identität prüfen / erlaubte Aktionen bestimmen.", "EN": "Check who signs in / determine what they may do."}], [{"FR": "Base / Entrepôt de données", "DE": "Datenbank / Data Warehouse", "EN": "Database / data warehouse"}, {"FR": "Stockage structuré / stockage organisé pour historique et analyse. Une sauvegarde reste une copie de secours distincte.", "DE": "Strukturierter Speicher / für Historie und Analyse organisierter Speicher. Ein Backup ist eine separate Sicherungskopie.", "EN": "Structured storage / storage organised for history and analysis. A backup remains a separate recovery copy."}], [{"FR": "Branche / PR / Déploiement", "DE": "Branch / PR / Bereitstellung", "EN": "Branch / PR / deployment"}, {"FR": "Travail isolé / proposition de changement à relire / mise à disposition sur un serveur.", "DE": "Isolierter Arbeitsstand / Änderungsvorschlag zur Prüfung / Bereitstellung auf einem Server.", "EN": "Isolated work / change proposal for review / release to a server."}], [{"FR": "Fournisseur / Opérateur / Responsable", "DE": "Anbieter / Betreiber / Verantwortlicher", "EN": "Provider / operator / accountable owner"}, {"FR": "Fournit un service / agit sur le système / répond de la décision et de son suivi.", "DE": "Liefert einen Dienst / bedient das System / verantwortet Entscheidung und Nachverfolgung.", "EN": "Supplies a service / operates the system / owns the decision and follow-through."}], [{"FR": "KPI / FX / CRM", "DE": "KPI / FX / CRM", "EN": "KPI / FX / CRM"}, {"FR": "Indicateur de pilotage / change monétaire / gestion des relations clients.", "DE": "Steuerungskennzahl / Währungsumrechnung / Kundenbeziehungsmanagement.", "EN": "Performance indicator / foreign exchange / customer relationship management."}]]}, {"type": "table", "title": {"FR": "Repères du cycle de livraison", "DE": "Begriffe des Lieferzyklus", "EN": "Delivery-cycle reference"}, "heads": {"FR": ["Terme", "Explication simple"], "DE": ["Begriff", "Einfache Erklärung"], "EN": ["Term", "Plain explanation"]}, "rows": [[{"FR": "Dépôt", "DE": "Repository", "EN": "Repository"}, {"FR": "Dossier central où le code et son historique sont conservés.", "DE": "Zentraler Ort für Code und Versionsgeschichte.", "EN": "Central place where code and its history are kept."}], [{"FR": "Commit", "DE": "Commit", "EN": "Commit"}, {"FR": "Enregistrement identifié d’un ensemble précis de changements.", "DE": "Identifizierte Aufzeichnung eines bestimmten Änderungssatzes.", "EN": "Identified record of a specific set of changes."}], [{"FR": "Build", "DE": "Build", "EN": "Build"}, {"FR": "Transformation du code en version exécutable ou publiable.", "DE": "Umwandlung des Codes in eine ausführbare oder veröffentlichbare Version.", "EN": "Transformation of code into a runnable or publishable version."}], [{"FR": "Environnement", "DE": "Umgebung", "EN": "Environment"}, {"FR": "Espace séparé où une version est configurée et utilisée : test, preview ou production.", "DE": "Getrennter Bereich, in dem eine Version konfiguriert und genutzt wird: Test, Preview oder Produktion.", "EN": "Separate space where a version is configured and used: test, preview or production."}], [{"FR": "Hébergeur", "DE": "Hosting-Anbieter", "EN": "Hosting provider"}, {"FR": "Fournisseur qui met à disposition les serveurs ou services nécessaires.", "DE": "Anbieter der erforderlichen Server oder Dienste.", "EN": "Provider supplying the required servers or services."}], [{"FR": "Production informatique", "DE": "IT-Produktivbetrieb", "EN": "IT production"}, {"FR": "Environnement réel utilisé par les personnes autorisées.", "DE": "Reale Umgebung für autorisierte Nutzer.", "EN": "Real environment used by authorised people."}], [{"FR": "Production métier", "DE": "Fachliche Produktion", "EN": "Business production"}, {"FR": "Fonction M3S consacrée aux commandes, fournisseurs, fabrication, stocks et opérations associées.", "DE": "M3S-Funktion für Bestellungen, Lieferanten, Fertigung, Bestände und zugehörige Abläufe.", "EN": "M3S function for orders, suppliers, manufacturing, stock and related operations."}], [{"FR": "Activation", "DE": "Aktivierung", "EN": "Activation"}, {"FR": "Décision contrôlée qui rend une fonction utilisable dans un périmètre donné.", "DE": "Kontrollierte Entscheidung, die eine Funktion in einem bestimmten Umfang nutzbar macht.", "EN": "Controlled decision making a zung und Übergabe an Codex", "EN": "Usage and handoff to Codex"}, "body": {"FR": "Ouvrir le HTML dans un navigateur : aucune installation ni connexion requise. Choisir FR/DE/EN, naviguer, rechercher, déplier les menus ou imprimer. Les liens externes demandent Internet. Le Markdown contient le même contenu dans les trois langues. Pour intégration future : conserver les identifiants de sections, le menu sourcé, la date et les statuts ; raccorder aux traductions et permissions M3S ; revalider les sources. Cette livraison n’effectue aucun déploiement M3S et ne modifie aucun service.", "DE": "HTML im Browser öffnen: keine Installation oder Anmeldung nötig. FR/DE/EN wählen, navigieren, suchen, Menüs aufklappen oder drucken. Externe Links benötigen Internet. Markdown enthält denselben Inhalt in drei Sprachen. Für spätere Integration: Abschnitts-IDs, belegtes Menü, Datum und Status erhalten; mit M3S-Übersetzungen und Berechtigungen verbinden; Quellen erneut prüfen. Diese Lieferung stellt nichts in M3S bereit und ändert keine Dienste.", "EN": "Open the HTML in a browser: no installation or sign-in required. Choose FR/DE/EN, navigate, search, expand menus or print. External links need Internet. Markdown contains the same content in all three languages. For later integration: preserve section IDs, sourced menu, date and status; connect to M3S translations and permissions; revalidate sources. This delivery does not deploy to M3S or change any services."}}]}], "sources": [["S1", "Inventaire technique M3S V2.2 du 13.09.2026 — source antérieure à cette Boussole V3.1", ""], ["S2", "ARCHITECTURE_OFFRE M3S_04_07_26.txt", ""], ["S3", "Architecture_Documents_Directeurs_Et_Strategiques_2SG_M3S.md", ""], ["S4", "M3S_ARCHITECTURE_AGENTS_FUSIONNEE.md — 17.05.2026", ""], ["S5", "M3S_ARCHITECTURE_VISUELLE_SYSTEME_04JUIN2026.md + M3S_TECH_STACK_INVENTAIRE_04JUIN2026.md", ""], ["S6", "GitHub — menuStructure.json, sidebarMenu.js, designSystem.css · e2141df74a38739fb72ae0902f9cce62894f0a0a", "ht function menus(){const u=D.ui[lang];return `<button class="plainbtn" id="expand">${esc(u.all)}</button><p class="muted">${esc(u.menuNote)}</p>`+D.menu.groups.map(g=>`<div class="group"><h3>${esc(g.label[lang])}</h3>${g.itemIds.map(id=>{const m=D.menu.menu.find(x=>x.id===id);return `<details class="menudetail"><summary>${esc(m.label[lang])}<small>${m.children.length} · ${esc(m.path)}</small></summary><div class="submenu">${m.children.map(c=>`<div class="menuitem">${esc(c.label[lang])}<code>${esc(c.path)}</code>${c.requiredPermission?`<span class="permission">${esc(u.permission)} : ${esc(c.requiredPermission)}</span>`:''}</div>`).join('')}</div></details>`}).join('')}</div>`).join('')}
function block(b){const title=b.title?`<h2>${esc(b.title[lang])}</h2>`:'';if(b.type==='prose')return `<div class="block">${title}<p>${esc(b.body[lang])}</p></div>`;if(b.type==='table')return `<div class="block">${title}<div class="tablewrap" tabindex="0" role="region" aria-label="${esc(b.title[lang])}"><table><thead><tr>${b.heads[lang].map(x=>'<th scope="col">'+esc(x)+'</th>').join('')}</tr></thead><tbody>${b.rows.map(r=>'<tr>'+r.map((c,i)=>i?'<td>'+esc(c[lang])+'</td>':'<th scope="row">'+esc(c[lang])+'</th>').join('')+'</tr>').join('')}</tbody></table></div></div>`;if(b.type==='menu')return menus();if(b.type==='systemmap')return systemmap();if(b.type==='sources')return '<ul class="source-list">'+D.sources.map(([id,name,url])=>`<li><b>${id}</b>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a>`:esc(name)}</li>`).join('')+'</ul>';return ''}

function render(){const u=D.ui[lang],active=D.sections.find(s=>s.id===current);document.documentElement.lang=lang.toLowerCase();document.title='2SG / M3S — '+u.name;['date','read','offline','foot','skip','print','export'].forEach(k=>$(k).textContent=u[k]);$('brandname').textContent=u.name;$('translation').textContent=u.translations;$('section-title').textContent=active.intro[lang];$('section-subtitle').textContent=current==='overview'?u.subtitle:'';$('section-subtitle').classList.toggle('hidden',current!=='overview');$('search').placeholder=u.search;$('search').setAttribute('aria-label',u.search);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));$('nav').innerHTML=D.sections.map((s,i)=>`<a data-section="${s.id}" href="#${lang.toLowerCase()}/${s.id}" ${s.id===current?'aria-current="page"':''}><span>${i+1}</span>${esc(s.title[lang])}</a>`).join('');$('pages').innerHTML=D.sections.map(s=>`<section id="page-${s.id}" class="section ${s.id===current?'':'hidden'}" tabindex="-1">${s.id==='overview'?home():''}${s.blocks.map(block).join('')}</section>`).join('');document.querySelectorAll('[data-section]').forEach(a=>a.onclick=e=>{e.preventDefault();showSection(a.dataset.section)});if($('expand'))$('expand').onclick=()=>{const els=[...document.querySelectorAll('.menudetail')],open=els.some(x=>!x.open);els.forEach(x=>x.open=open);$('expand').textContent=open?u.close:u.all};applyTheme();search();}
function showSection(id,nextLang=lang){lang=['FR','DE','EN'].includes(nextLang)?nextLang:lang;current=D.sections.some(x=>x.id===id)?id:'overview';$('search').value='';render();$('page-'+current).focus();window.scrollTo(0,0)}

function search(){const q=$('search').value.trim().toLocaleLowerCase();$('results').classList.toggle('hidden',!q);$('pages').classList.toggle('hidden',!!q);if(!q)return;const matches=D.sections.filter(s=>$('page-'+s.id).textContent.toLocaleLowerCase().includes(q));$('results').innerHTML=`<h1>${esc(D.ui[lang].results)}</h1><p>${matches.length}</p>`+(matches.length?matches.map(s=>`<button class="result" data-result="${s.id}"><strong>${esc(s.title[lang])}</strong><p>${esc(s.intro[lang])}</p></button>`).join(''):`<p>${esc(D.ui[lang].none)}</p>`);document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>showSection(b.dataset.result))}
